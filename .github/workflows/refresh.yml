name: Refresh Telemetry

on:
  schedule:
    - cron: "30 18 * * *"   # 03:30 JST daily
  workflow_dispatch:
  push:
    branches:
      - main

# Every panel is drawn here and committed, so the profile depends on no
# third-party image service at view time — and nothing can go stale or dark
# on someone else's outage.
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Redraw the HUD from live repository telemetry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUD_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/render_hud.py

      - name: Audit the panels for frozen-frame blanks
        run: python3 scripts/check_frame0.py

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh telemetry panels"
            git push
          fi
