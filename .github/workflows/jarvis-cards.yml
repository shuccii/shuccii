name: Refresh JARVIS Diagnostics Cards

on:
  schedule:
    - cron: "30 18 * * *"   # 03:30 JST daily
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The cards are fetched with the arc-reactor palette and committed to the repo,
      # so the README never depends on the upstream API being up at view time.
      # No `animation=` here on purpose: those presets start at opacity 0, so any
      # renderer that freezes SVGs on frame 0 would show an empty card.
      - name: Fetch cards with arc-reactor palette
        run: |
          set -euo pipefail
          mkdir -p assets/cards
          BASE="https://github-profile-summary-cards.vercel.app/api/cards"
          PAL="username=${{ github.repository_owner }}&theme=github_dark&bg_color=05090f&title_color=67e8f9&text_color=bfe9f5&border_color=0e7490&icon_color=f5b841&chart_color=22d3ee"
          fetch () {
            name="$1"; extra="${2:-}"
            if curl -sS --fail --retry 3 --retry-delay 5 --max-time 60 \
                 "$BASE/$name?$PAL$extra" -o "assets/cards/$name.svg.tmp"; then
              mv "assets/cards/$name.svg.tmp" "assets/cards/$name.svg"
              echo "updated $name"
            else
              rm -f "assets/cards/$name.svg.tmp"
              echo "::warning::could not refresh $name — keeping the committed version"
            fi
          }
          fetch profile-details
          fetch repos-per-language
          fetch most-commit-language
          fetch stats
          fetch productive-time "&utcOffset=9"

      - name: Commit refreshed cards
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh JARVIS diagnostics cards"
            git push
          fi
