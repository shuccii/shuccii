name: Generate Perimeter Scan (snake)

on:
  schedule:
    - cron: "0 18 * * *"   # 03:00 JST daily
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Generate contribution scan
        uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          # level-0 dots stay a step off the page colour so the grid the scan
          # travels over still reads as a grid in either theme
          outputs: |
            dist/github-snake-dark.svg?color_snake=#e8b455&color_dots=#12384a,#12617a,#1e9bbd,#4fd0ee,#a8f0ff
            dist/github-snake.svg?color_snake=#9a6a10&color_dots=#d3e3ea,#a3cddd,#5aa8c5,#26809f,#0b5570

      - name: Push scan to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
