name: Generate Perimeter Scan (snake)

on:
  schedule:
    - cron: "0 18 * * *"   # 03:00 JST daily
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Generate contribution scan
        uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          # level-0 dots stay slightly lighter than the page so the grid reads as a grid
          outputs: |
            dist/github-snake.svg?color_snake=#f5b841&color_dots=#0d2430,#155e75,#0e97b8,#22d3ee,#7defff

      - name: Push scan to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
