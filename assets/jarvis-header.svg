<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="J.A.R.V.I.S. interface header for Shuichi Tani">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#02060c"/>
      <stop offset="55%" stop-color="#04101c"/>
      <stop offset="100%" stop-color="#02070e"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="28%" stop-color="#b8f4ff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#67e8f9" stop-opacity="0.75"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="50%" stop-color="#f5b841"/>
      <stop offset="100%" stop-color="#c8892a"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#0e3a4d" stroke-width="0.6" opacity="0.55"/>
    </pattern>
    <clipPath id="frame"><rect x="0" y="0" width="900" height="280" rx="6"/></clipPath>
    <style>
      .mono { font-family: "SFMono-Regular", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
      .blink { animation: blink 1.6s steps(1,end) infinite; }
      @keyframes blink { 0%,55% { opacity:1 } 56%,100% { opacity:0.15 } }
      .flick { animation: flick 4.5s ease-in-out infinite; }
      @keyframes flick { 0%,92%,100% { opacity:1 } 94% { opacity:.45 } 96% { opacity:1 } 98% { opacity:.6 } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="280" fill="url(#bg)"/>
    <rect width="900" height="280" fill="url(#grid)" opacity="0.5"/>

    <!-- horizon glow -->
    <ellipse cx="450" cy="292" rx="520" ry="70" fill="#0e7490" opacity="0.22" filter="url(#softglow)"/>

    <!-- ============ ARC REACTOR ============ -->
    <g transform="translate(132,140)">
      <circle r="86" fill="#22d3ee" opacity="0.07" filter="url(#softglow)"/>

      <!-- outer dashed ring : clockwise -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
        <circle r="76" fill="none" stroke="#22d3ee" stroke-width="1.6" stroke-dasharray="26 12" opacity="0.75"/>
        <circle r="76" fill="none" stroke="#f5b841" stroke-width="2.6" stroke-dasharray="3 231" opacity="0.9"/>
      </g>

      <!-- tick ring : counter-clockwise -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="26s" repeatCount="indefinite"/>
        <circle r="64" fill="none" stroke="#0e7490" stroke-width="7" stroke-dasharray="2 8" opacity="0.85"/>
      </g>

      <!-- segmented ring : clockwise fast -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
        <circle r="52" fill="none" stroke="#67e8f9" stroke-width="3" stroke-dasharray="46 20" opacity="0.85" filter="url(#glow)"/>
      </g>

      <!-- static housing -->
      <circle r="44" fill="none" stroke="#155e75" stroke-width="8" opacity="0.9"/>
      <circle r="44" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.6"/>

      <!-- reactor coils (triangular stator, like the Mk II reactor) -->
      <g stroke="#0891b2" stroke-width="2.4" fill="none" opacity="0.95">
        <path d="M0 -40 L34 20 L-34 20 Z"/>
        <path d="M0 40 L-34 -20 L34 -20 Z" opacity="0.55"/>
      </g>
      <g fill="#22d3ee" opacity="0.9">
        <circle cx="0" cy="-40" r="3.4"/><circle cx="34" cy="20" r="3.4"/><circle cx="-34" cy="20" r="3.4"/>
      </g>

      <!-- core -->
      <circle r="30" fill="url(#coreGlow)">
        <animate attributeName="r" values="27;32;27" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.85;1;0.85" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle r="13" fill="#eaffff" filter="url(#glow)">
        <animate attributeName="r" values="11.5;14.5;11.5" dur="2.1s" repeatCount="indefinite"/>
      </circle>

      <!-- energy pulse rings -->
      <circle r="44" fill="none" stroke="#67e8f9" stroke-width="1.6" opacity="0">
        <animate attributeName="r" values="34;92" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.75;0" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle r="44" fill="none" stroke="#f5b841" stroke-width="1.2" opacity="0">
        <animate attributeName="r" values="34;92" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ============ TEXT BLOCK ============ -->
    <g class="mono">
      <text x="252" y="76" fill="#f5b841" font-size="12.5" letter-spacing="4.5" opacity="0.92">STARK-STYLE INTERFACE // v5.1</text>

      <text x="252" y="132" fill="#e6feff" font-size="45" font-weight="700" letter-spacing="7" filter="url(#glow)" class="flick">SHUICHI TANI</text>

      <path d="M252 148 H812" stroke="#0e7490" stroke-width="1.2" opacity="0.8"/>
      <path d="M252 148 H452" stroke="#f5b841" stroke-width="2" opacity="0.95"/>

      <text x="252" y="176" fill="#7dd3fc" font-size="14.5" letter-spacing="2.6">MATERIALS INFORMATICS &#183; MACHINE LEARNING &#183; FUSION</text>

      <g font-size="12.5" letter-spacing="1.6">
        <text x="252" y="208" fill="#4b8ba3">SYS:</text>
        <text x="292" y="208" fill="#34d399">ONLINE</text>
        <text x="368" y="208" fill="#4b8ba3">REACTOR:</text>
        <text x="444" y="208" fill="#22d3ee">STABLE</text>
        <text x="524" y="208" fill="#4b8ba3">MODE:</text>
        <text x="572" y="208" fill="#f5b841">RESEARCH</text>
        <text x="668" y="208" fill="#34d399" class="blink">&#9679; LIVE</text>
      </g>

      <text x="252" y="238" fill="#8ed8ef" font-size="13" letter-spacing="1.3">&gt; J.A.R.V.I.S. &#8212; all systems nominal, sir.</text>
      <rect x="612" y="228" width="8" height="13" fill="#f5b841" class="blink"/>
    </g>

    <!-- ============ HUD FRAME ============ -->
    <g stroke="#22d3ee" stroke-width="1.8" fill="none" opacity="0.85">
      <path d="M12 44 V12 H68"/>
      <path d="M888 44 V12 H832"/>
      <path d="M12 236 V268 H68"/>
      <path d="M888 236 V268 H832"/>
    </g>
    <g stroke="#f5b841" stroke-width="1.6" fill="none" opacity="0.75">
      <path d="M78 12 H120"/><path d="M780 268 H822"/>
    </g>

    <!-- right telemetry -->
    <g class="mono" opacity="0.8">
      <g stroke="#0e7490" stroke-width="1.4">
        <path d="M846 90 H872"/><path d="M846 104 H864"/><path d="M846 118 H876"/>
        <path d="M846 132 H860"/><path d="M846 146 H870"/><path d="M846 160 H866"/>
        <path d="M846 174 H878"/><path d="M846 188 H858"/>
      </g>
      <circle cx="862" cy="60" r="9" fill="none" stroke="#22d3ee" stroke-width="1.4"/>
      <circle cx="862" cy="60" r="2.6" fill="#22d3ee"/>
      <path d="M862 47 V53 M862 67 V73 M849 60 H855 M869 60 H875" stroke="#22d3ee" stroke-width="1.2"/>
    </g>

    <!-- scan sweep -->
    <rect x="-320" y="0" width="320" height="280" fill="url(#sweep)" opacity="0.16">
      <animate attributeName="x" values="-320;900" dur="6.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="900" height="1.4" fill="#67e8f9" opacity="0.35">
      <animate attributeName="y" values="0;280;0" dur="11s" repeatCount="indefinite"/>
    </rect>

    <rect x="0.75" y="0.75" width="898.5" height="278.5" rx="6" fill="none" stroke="#0e7490" stroke-width="1.5" opacity="0.7"/>
  </g>
</svg>
