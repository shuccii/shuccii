<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="J.A.R.V.I.S. holographic interface for Shuichi Tani">
<defs>
  <radialGradient id="deep" cx="16%" cy="48%" r="86%">
    <stop offset="0%"   stop-color="#0a2734"/>
    <stop offset="42%"  stop-color="#04121d"/>
    <stop offset="100%" stop-color="#01050a"/>
  </radialGradient>
  <radialGradient id="vig" cx="50%" cy="50%" r="72%">
    <stop offset="55%"  stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.72"/>
  </radialGradient>

  <!-- glass core -->
  <radialGradient id="core" cx="50%" cy="42%" r="58%">
    <stop offset="0%"   stop-color="#ffffff"/>
    <stop offset="14%"  stop-color="#e2fbff"/>
    <stop offset="34%"  stop-color="#6fdcff" stop-opacity="0.88"/>
    <stop offset="62%"  stop-color="#1490b4" stop-opacity="0.5"/>
    <stop offset="86%"  stop-color="#0a4f66" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#062f3f" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="dome" cx="34%" cy="24%" r="40%">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.42"/>
    <stop offset="48%"  stop-color="#ffffff" stop-opacity="0.07"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>

  <!-- brushed-metal housing, lit by a travelling point light -->
  <linearGradient id="ringMetal" x1="0" y1="0" x2="0.7" y2="1">
    <stop offset="0%"   stop-color="#0d3f52"/>
    <stop offset="35%"  stop-color="#2a7f9b"/>
    <stop offset="55%"  stop-color="#0a2f3e"/>
    <stop offset="100%" stop-color="#154b60"/>
  </linearGradient>
  <linearGradient id="goldMetal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%"   stop-color="#7a4f12"/>
    <stop offset="28%"  stop-color="#ffe9a8"/>
    <stop offset="52%"  stop-color="#c8892a"/>
    <stop offset="76%"  stop-color="#ffd889"/>
    <stop offset="100%" stop-color="#6d4510"/>
  </linearGradient>

  <filter id="spec" x="-45%" y="-45%" width="190%" height="190%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3.4" result="height"/>
    <feSpecularLighting in="height" surfaceScale="5.5" specularConstant="1.15"
                        specularExponent="24" lighting-color="#e4faff" result="sp">
      <fePointLight x="-70" y="-70" z="70">
        <animate attributeName="x" values="-80;80;-80" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-70;70;-70" dur="11s" repeatCount="indefinite"/>
      </fePointLight>
    </feSpecularLighting>
    <feComposite in="sp" in2="SourceAlpha" operator="in" result="spc"/>
    <feComposite in="SourceGraphic" in2="spc" operator="arithmetic" k1="0" k2="1" k3="0.95" k4="0"/>
  </filter>

  <!-- volumetric bloom: three blur radii merged -->
  <filter id="bloom" x="-90%" y="-90%" width="280%" height="280%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="2"  result="b1"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="7"  result="b2"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="13" result="b3"/>
    <feMerge>
      <feMergeNode in="b3"/><feMergeNode in="b2"/>
      <feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="bloomS" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b1"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="5"   result="b2"/>
    <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="depth" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="1.5"/>
  </filter>
  <filter id="haze" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="11"/>
  </filter>

  <!-- holographic interference grain -->
  <filter id="holo" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="3" result="n">
      <animate attributeName="seed" values="3;9;17;3" dur="1.2s" calcMode="discrete" repeatCount="indefinite"/>
    </feTurbulence>
    <feColorMatrix in="n" type="matrix"
      values="0 0 0 0 0.13   0 0 0 0 0.72   0 0 0 0 0.85   0 0 0 0.32 0"/>
  </filter>

  <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#67e8f9" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#22d3ee" stop-opacity="0"/>
    <stop offset="46%"  stop-color="#67e8f9" stop-opacity="0.5"/>
    <stop offset="54%"  stop-color="#ffffff" stop-opacity="0.75"/>
    <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#000000" stop-opacity="1"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </linearGradient>
  <mask id="floorMask"><rect x="0" y="196" width="900" height="104" fill="url(#floorFade)" transform="translate(0,300) scale(1,-1) translate(0,-300)"/></mask>

  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1.2" fill="#0a3d4d" opacity="0.34"/>
  </pattern>
  <clipPath id="fr"><rect width="900" height="300" rx="7"/></clipPath>

  <style>
    .m { font-family:"SFMono-Regular","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace; }
  </style>
</defs>

<g clip-path="url(#fr)">
  <rect width="900" height="300" fill="url(#deep)"/>

  <!-- ===== perspective floor, receding to a vanishing point ===== -->
  <g mask="url(#floorMask)" opacity="0.8">
    <g stroke="#17738f" stroke-width="1.1">
      <path d="M450 196 L-560 300"/><path d="M450 196 L-300 300"/><path d="M450 196 L-90 300"/>
      <path d="M450 196 L80 300"/>  <path d="M450 196 L220 300"/> <path d="M450 196 L330 300"/>
      <path d="M450 196 L570 300"/> <path d="M450 196 L680 300"/> <path d="M450 196 L820 300"/>
      <path d="M450 196 L1010 300"/><path d="M450 196 L1200 300"/><path d="M450 196 L1460 300"/>
    </g>
    <g stroke="#0e7490" stroke-width="1.1" fill="none">
      <path d="M0 214 H900"><animate attributeName="d" values="M0 206 H900;M0 214 H900;M0 206 H900" dur="6s" repeatCount="indefinite"/></path>
      <path d="M0 232 H900"><animate attributeName="d" values="M0 222 H900;M0 236 H900;M0 222 H900" dur="6s" repeatCount="indefinite"/></path>
      <path d="M0 258 H900"><animate attributeName="d" values="M0 244 H900;M0 266 H900;M0 244 H900" dur="6s" repeatCount="indefinite"/></path>
      <path d="M0 292 H900"><animate attributeName="d" values="M0 274 H900;M0 300 H900;M0 274 H900" dur="6s" repeatCount="indefinite"/></path>
    </g>
  </g>

  <!-- ===== volumetric light shafts from the reactor ===== -->
  <g opacity="0.34" filter="url(#haze)">
    <path d="M150 150 L900 62 L900 238 Z" fill="url(#shaft)"/>
    <path d="M150 150 L520 -30 L640 -30 Z" fill="url(#shaft)" opacity="0.4"/>
  </g>

  <!-- ================= ARC REACTOR ================= -->
  <g transform="translate(150,150)">
    <circle r="104" fill="#22d3ee" opacity="0.09" filter="url(#bloom)"/>

    <!-- gyroscope: three tilted orbital rings -->
    <g opacity="0.92">
      <g transform="rotate(0)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="17s" repeatCount="indefinite"/>
        <ellipse rx="92" ry="30" fill="none" stroke="#1d7f9c" stroke-width="1.6" opacity="0.85"/>
        <ellipse rx="92" ry="30" fill="none" stroke="#7defff" stroke-width="2.4" stroke-dasharray="10 570" filter="url(#bloomS)"/>
      </g>
      <g transform="rotate(62)">
        <animateTransform attributeName="transform" type="rotate" from="62" to="422" dur="23s" repeatCount="indefinite"/>
        <ellipse rx="88" ry="26" fill="none" stroke="#155e75" stroke-width="1.5" opacity="0.8"/>
        <ellipse rx="88" ry="26" fill="none" stroke="#f5b841" stroke-width="2" stroke-dasharray="7 540" filter="url(#bloomS)"/>
      </g>
      <g transform="rotate(-58)">
        <animateTransform attributeName="transform" type="rotate" from="-58" to="302" dur="29s" repeatCount="indefinite"/>
        <ellipse rx="84" ry="21" fill="none" stroke="#12617a" stroke-width="1.4" opacity="0.75"/>
      </g>
    </g>

    <!-- data ring : dashes + measurement ticks -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="21s" repeatCount="indefinite"/>
      <circle r="74" fill="none" stroke="#0e7490" stroke-width="8" stroke-dasharray="1.6 9" opacity="0.85"/>
      <circle r="74" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.5"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
      <circle r="62" fill="none" stroke="#67e8f9" stroke-width="3" stroke-dasharray="52 26" opacity="0.9" filter="url(#bloomS)"/>
      <circle r="62" fill="none" stroke="#f5b841" stroke-width="3" stroke-dasharray="9 381" opacity="0.95" filter="url(#bloomS)"/>
    </g>

    <!-- machined housing : metal gradient + specular lighting -->
    <circle r="48" fill="none" stroke="url(#ringMetal)" stroke-width="13" filter="url(#spec)"/>
    <circle r="54.5" fill="none" stroke="#0a2a38" stroke-width="1.6" opacity="0.95"/>
    <circle r="41.5" fill="none" stroke="#03161f" stroke-width="1.6" opacity="0.95"/>
    <circle r="48" fill="none" stroke="url(#goldMetal)" stroke-width="1.6" opacity="0.5"/>

    <!-- stator coils -->
    <g fill="none" stroke="#2fa8c8" stroke-width="3.2" opacity="0.9" filter="url(#depth)">
      <path d="M0 -37 L32 18 L-32 18 Z"/>
      <path d="M0 37 L-32 -18 L32 -18 Z" opacity="0.45" stroke="#1a7d9c"/>
    </g>
    <g fill="#7defff" filter="url(#bloomS)">
      <circle cx="0" cy="-37" r="3.6"><animate attributeName="r" values="2.8;4.4;2.8" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="32" cy="18"  r="3.6"><animate attributeName="r" values="4.4;2.8;4.4" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="-32" cy="18" r="3.6"><animate attributeName="r" values="3.4;4.4;3.4" dur="2.6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- plasma core + glass dome -->
    <circle r="33" fill="url(#core)" filter="url(#bloom)">
      <animate attributeName="r" values="30;35;30" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="14" fill="#f2ffff" filter="url(#bloom)">
      <animate attributeName="r" values="12;16;12" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="34" fill="url(#dome)"/>
    <circle r="34" fill="none" stroke="#0a3f52" stroke-width="1.8" opacity="0.85"/>
    <circle r="34" fill="none" stroke="#9ff0ff" stroke-width="1" opacity="0.35"/>
    <path d="M-24 -14 A28 28 0 0 1 6 -30" fill="none" stroke="#ffffff" stroke-width="2.6"
          stroke-linecap="round" opacity="0.6" filter="url(#bloomS)"/>

    <!-- energy shockwaves -->
    <circle fill="none" stroke="#7defff" stroke-width="1.8" opacity="0">
      <animate attributeName="r" values="36;108" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle fill="none" stroke="#f5b841" stroke-width="1.2" opacity="0">
      <animate attributeName="r" values="36;108" dur="4s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0" dur="4s" begin="2s" repeatCount="indefinite"/>
    </circle>

    <!-- orbiting particles -->
    <g fill="#a8f3ff" filter="url(#bloomS)">
      <circle r="2.2"><animateMotion dur="8s"  repeatCount="indefinite" path="M0,-70 A70,70 0 1,1 -0.1,-70"/></circle>
      <circle r="1.7"><animateMotion dur="11s" repeatCount="indefinite" path="M0,86 A86,86 0 1,0 0.1,86"/></circle>
      <circle r="1.5" fill="#ffd889"><animateMotion dur="6.5s" repeatCount="indefinite" path="M0,-56 A56,56 0 1,1 -0.1,-56"/></circle>
    </g>
  </g>

  <!-- ================= HUD TEXT ================= -->
  <g class="m">
    <text x="286" y="80" fill="#f5b841" font-size="12.5" letter-spacing="4.6" opacity="0.95">STARK-STYLE INTERFACE // v5.1</text>

    <!-- chromatic aberration: red / cyan fringes behind the white face -->
    <g font-size="47" font-weight="700" letter-spacing="7">
      <text x="284.4" y="136" fill="#ff3b3b" opacity="0.5">SHUICHI TANI</text>
      <text x="287.6" y="136" fill="#25f2ff" opacity="0.5">SHUICHI TANI</text>
      <text x="286"   y="136" fill="#f4feff" filter="url(#bloomS)">SHUICHI TANI</text>
    </g>

    <path d="M286 154 H842" stroke="#0e7490" stroke-width="1.2" opacity="0.85"/>
    <path d="M286 154 H486" stroke="url(#goldMetal)" stroke-width="2.4" opacity="1"/>

    <text x="286" y="184" fill="#8fd9f0" font-size="14.5" letter-spacing="2.6">MATERIALS INFORMATICS &#183; MACHINE LEARNING &#183; FUSION</text>

    <g font-size="12.5" letter-spacing="1.6">
      <text x="286" y="216" fill="#4b8ba3">SYS:</text>
      <text x="326" y="216" fill="#34d399" filter="url(#bloomS)">ONLINE</text>
      <text x="402" y="216" fill="#4b8ba3">REACTOR:</text>
      <text x="478" y="216" fill="#22d3ee" filter="url(#bloomS)">STABLE</text>
      <text x="558" y="216" fill="#4b8ba3">MODE:</text>
      <text x="606" y="216" fill="#f5b841" filter="url(#bloomS)">RESEARCH</text>
      <text x="702" y="216" fill="#34d399">&#9679; LIVE
        <animate attributeName="opacity" values="1;1;0.15;1" keyTimes="0;0.55;0.6;1" dur="1.8s" repeatCount="indefinite"/>
      </text>
    </g>

    <text x="286" y="248" fill="#8ed8ef" font-size="13" letter-spacing="1.3">&gt; J.A.R.V.I.S. &#8212; all systems nominal, sir.</text>
    <rect x="646" y="238" width="8" height="13" fill="#f5b841">
      <animate attributeName="opacity" values="1;1;0.1;0.1" keyTimes="0;0.5;0.55;1" dur="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- right-hand telemetry -->
  <g class="m" opacity="0.85">
    <g stroke="#0e7490" stroke-width="1.4">
      <path d="M858 104 H884"><animate attributeName="d" values="M858 104 H884;M858 104 H870;M858 104 H884" dur="3.4s" repeatCount="indefinite"/></path>
      <path d="M858 118 H872"><animate attributeName="d" values="M858 118 H872;M858 118 H886;M858 118 H872" dur="4.1s" repeatCount="indefinite"/></path>
      <path d="M858 132 H880"/>
      <path d="M858 146 H866"><animate attributeName="d" values="M858 146 H866;M858 146 H884;M858 146 H866" dur="2.9s" repeatCount="indefinite"/></path>
      <path d="M858 160 H876"/>
      <path d="M858 174 H882"><animate attributeName="d" values="M858 174 H882;M858 174 H864;M858 174 H882" dur="3.7s" repeatCount="indefinite"/></path>
      <path d="M858 188 H868"/>
      <path d="M858 202 H878"/>
    </g>
    <g transform="translate(872,70)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="11s" repeatCount="indefinite" additive="sum"/>
      <circle r="10" fill="none" stroke="#22d3ee" stroke-width="1.3" stroke-dasharray="10 5"/>
    </g>
    <circle cx="872" cy="70" r="2.8" fill="#22d3ee" filter="url(#bloomS)"/>
    <path d="M872 56 V62 M872 78 V84 M858 70 H864 M880 70 H886" stroke="#22d3ee" stroke-width="1.2"/>
  </g>

  <!-- ===== atmosphere: sweep, scanlines, grain, vignette ===== -->
  <rect x="-340" y="0" width="340" height="300" fill="url(#sweep)" opacity="0.13">
    <animate attributeName="x" values="-340;900" dur="7.5s" repeatCount="indefinite"/>
  </rect>
  <rect width="900" height="300" fill="url(#scan)" opacity="0.42"/>
  <rect width="900" height="300" filter="url(#holo)" opacity="0.5"/>
  <rect width="900" height="300" fill="url(#vig)"/>
  <rect width="900" height="2" fill="#9ff0ff" opacity="0.16">
    <animate attributeName="y" values="0;300;0" dur="13s" repeatCount="indefinite"/>
  </rect>

  <!-- frame -->
  <g stroke="#22d3ee" stroke-width="1.8" fill="none" opacity="0.9">
    <path d="M13 48 V13 H72"/><path d="M887 48 V13 H828"/>
    <path d="M13 252 V287 H72"/><path d="M887 252 V287 H828"/>
  </g>
  <g stroke="#f5b841" stroke-width="1.6" fill="none" opacity="0.8">
    <path d="M82 13 H126"/><path d="M774 287 H818"/>
  </g>
  <rect x="0.9" y="0.9" width="898.2" height="298.2" rx="7" fill="none" stroke="#0e7490" stroke-width="1.6" opacity="0.75"/>
</g>
</svg>
