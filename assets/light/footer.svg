<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 128" width="900" height="128" role="img" aria-label="recent activity and account totals">
<defs>
  <radialGradient id="fDeep" cx="16%" cy="50%" r="88%">
    <stop offset="0%" stop-color="#ffffff"/><stop offset="46%" stop-color="#eef4f8"/>
    <stop offset="100%" stop-color="#dde8ef"/>
  </radialGradient>
  <radialGradient id="fVig" cx="50%" cy="50%" r="74%">
    <stop offset="58%" stop-color="#3d6b80" stop-opacity="0"/>
