    <circle cx="22" cy="19" r="0.9" fill="#0e7490"/>
    <text x="31" y="22" fill="#0e7490" font-size="7.4" letter-spacing="2.8">LANGUAGE MIX</text>
    <text x="423" y="22" fill="#5d8ba0" font-size="6.8" letter-spacing="1.8"
          text-anchor="end">10.6 MB</text>
  </g>
<g clip-path="url(#lnInner)">

