  <rect x="7" y="28" width="278" height="0.6" fill="#5d8ba0" opacity="0.5"/>
  <rect x="13" y="7.5" width="266" height="0.9" fill="url(#rdLip)"/>
  <rect x="7.3" y="7.3" width="277.4" height="181.4" rx="4" fill="none"
