<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 292 196" width="292" height="196" role="img" aria-label="contributions by weekday">
<defs>
  <radialGradient id="rdDeep" cx="16%" cy="50%" r="88%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
    <stop offset="46%" stop-color="#eef4f8" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#dde8ef" stop-opacity="0.2"/>
  </radialGradient>
  <radialGradient id="rdVig" cx="50%" cy="50%" r="74%">
    <stop offset="58%" stop-color="#3d6b80" stop-opacity="0"/>
    <stop offset="100%" stop-color="#3d6b80" stop-opacity="0.16"/>
  </radialGradient>
  <radialGradient id="rdCore" cx="50%" cy="42%" r="58%"><stop offset="0%" stop-color="#ffffff" stop-opacity="1"/><stop offset="26%" stop-color="#dff2fa" stop-opacity="1"/><stop offset="60%" stop-color="#7cc6dd" stop-opacity="0.5"/><stop offset="100%" stop-color="#bcd9e5" stop-opacity="0"/></radialGradient>
  <linearGradient id="rdSweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0e7490" stop-opacity="0"/>
    <stop offset="52%" stop-color="#0e7490" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
  </linearGradient>
  <filter id="rdBevel" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="hh"/>
    <feSpecularLighting in="hh" surfaceScale="3.6" specularConstant="0.85"
                        specularExponent="26" lighting-color="#dff6ff" result="s">
      <fePointLight x="-70" y="-70" z="60">
        <animate attributeName="x" values="-70;70;-70" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-70;70;-70" dur="13s" repeatCount="indefinite"/>
      </fePointLight>
    </feSpecularLighting>
    <feComposite in="s" in2="SourceAlpha" operator="in" result="sc"/>
    <feComposite in="SourceGraphic" in2="sc" operator="arithmetic" k1="0" k2="1" k3="0.41" k4="0"/>
  </filter>
  <filter id="rdGlow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="0.41" result="a"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="1.62" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="rdGrain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="5" result="n">
      <animate attributeName="seed" values="5;13;21;5" dur="1.3s" calcMode="discrete" repeatCount="indefinite"/>
    </feTurbulence>
    <feColorMatrix in="n" type="matrix"
      values="0 0 0 0 0.12  0 0 0 0 0.66  0 0 0 0 0.8  0 0 0 0.06 0"/>
  </filter>
  <pattern id="rdScan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="0.8" fill="#9dbccb" opacity="0.16"/>
  </pattern>
  <clipPath id="rdClip"><rect width="292" height="196" rx="3"/></clipPath>
  <style>.t{font-family:"SFMono-Regular","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;}</style>
  <!-- Fresnel: transparent looking straight through, reflective at the edges -->
  <linearGradient id="rdFace" x1="0.12" y1="0" x2="0.55" y2="1">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.4"/>
    <stop offset="46%"  stop-color="#eef4f8"   stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#dde8ef" stop-opacity="0.30"/>
  </linearGradient>
  <linearGradient id="rdEdgeV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.55"/>
    <stop offset="14%"  stop-color="#eef4f8"   stop-opacity="0"/>
    <stop offset="86%"  stop-color="#dde8ef" stop-opacity="0"/>
    <stop offset="100%" stop-color="#dde8ef" stop-opacity="0.34"/>
  </linearGradient>

  <!-- dispersion: the hues travel along the edge, so the colour itself flows -->
  <linearGradient id="rdIris" x1="0" y1="0" x2="1" y2="0.35"
                  gradientUnits="objectBoundingBox">
    <stop offset="0.00" stop-color="#2aa6c4"/>
    <stop offset="0.26" stop-color="#3fc9a8"/>
    <stop offset="0.48" stop-color="#ffffff"/>
    <stop offset="0.71" stop-color="#8f7ae0"/>
    <stop offset="1.00" stop-color="#e0a54a"/>
    <animate attributeName="x1" values="-1;0;1" dur="19s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;1;2" dur="19s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="rdIrisSoft" x1="0" y1="0" x2="1" y2="0.6">
    <stop offset="0.00" stop-color="#3fc9a8" stop-opacity="0.36"/>
    <stop offset="0.34" stop-color="#ffffff" stop-opacity="0.28"/>
    <stop offset="0.62" stop-color="#8f7ae0" stop-opacity="0.32"/>
    <stop offset="1.00" stop-color="#2aa6c4" stop-opacity="0.3"/>
    <animate attributeName="x1" values="-0.8;0.2;1.2" dur="26s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0.2;1.2;2.2" dur="26s" repeatCount="indefinite"/>
  </linearGradient>

  <!-- the polished top arris, and the ground bottom one -->
  <linearGradient id="rdArris" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="8%"   stop-color="#ffffff" stop-opacity="0.95"/>
    <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="rdSheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.72"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>

  <!-- a corner glint: light funnelled into the 90-degree arris -->
  <radialGradient id="rdGlint" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
    <stop offset="38%"  stop-color="#ffffff" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>

  <filter id="rdCast" x="-14%" y="-14%" width="128%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="4.5"
                  flood-color="#26495c"
                  flood-opacity="0.32"/>
  </filter>
  <filter id="rdCaustic" x="-40%" y="-60%" width="180%" height="260%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <clipPath id="rdShape"><path d="M10.00 7.00H282.00A3.00 3.00 0 0 1 285.00 10.00V186.00A3.00 3.00 0 0 1 282.00 189.00H10.00A3.00 3.00 0 0 1 7.00 186.00V10.00A3.00 3.00 0 0 1 10.00 7.00Z"/></clipPath>
  <clipPath id="rdInner"><path d="M10.00 28.00H282.00A3.00 3.00 0 0 1 285.00 31.00V186.00A3.00 3.00 0 0 1 282.00 189.00H10.00A3.00 3.00 0 0 1 7.00 186.00V31.00A3.00 3.00 0 0 1 10.00 28.00Z"/></clipPath>
</defs>


  <path d="M10.00 7.00H282.00A3.00 3.00 0 0 1 285.00 10.00V186.00A3.00 3.00 0 0 1 282.00 189.00H10.00A3.00 3.00 0 0 1 7.00 186.00V10.00A3.00 3.00 0 0 1 10.00 7.00Z" fill="#dde8ef" opacity="0.26" filter="url(#rdCast)"/>
  <rect x="51.5" y="191.0" width="189.0" height="7"
        fill="url(#rdIrisSoft)" opacity="0.42" filter="url(#rdCaustic)"/>

  <path d="M10.00 7.00H282.00A3.00 3.00 0 0 1 285.00 10.00V186.00A3.00 3.00 0 0 1 282.00 189.00H10.00A3.00 3.00 0 0 1 7.00 186.00V10.00A3.00 3.00 0 0 1 10.00 7.00Z" fill="url(#rdFace)"/>
  <path d="M10.00 7.00H282.00A3.00 3.00 0 0 1 285.00 10.00V186.00A3.00 3.00 0 0 1 282.00 189.00H10.00A3.00 3.00 0 0 1 7.00 186.00V10.00A3.00 3.00 0 0 1 10.00 7.00Z" fill="url(#rdEdgeV)"/>

  <!-- edge band: dispersion strongest where the sheet is seen at a grazing angle -->
  <g clip-path="url(#rdShape)">
    <path d="M10.00 7.00H282.00A3.00 3.00 0 0 1 285.00 10.00V186.00A3.00 3.00 0 0 1 282.00 189.00H10.00A3.00 3.00 0 0 1 7.00 186.00V10.00A3.00 3.00 0 0 1 10.00 7.00Z" fill="none"
          stroke="url(#rdIrisSoft)" stroke-width="18"
          opacity="0.2"/>
    <rect x="-132.0" y="7" width="139.0" height="182"
          fill="url(#rdSheen)" opacity="0.34" transform="skewX(-12)">
      <animate attributeName="x" values="-145.9;312.8" dur="17s" repeatCount="indefinite"/>
    </rect>
    <ellipse cx="10.0" cy="10.0" rx="10" ry="10" fill="url(#rdGlint)" opacity="0.7"/><ellipse cx="282.0" cy="10.0" rx="10" ry="10" fill="url(#rdGlint)" opacity="0.4"/><ellipse cx="10.0" cy="186.0" rx="10" ry="10" fill="url(#rdGlint)" opacity="0.28"/><ellipse cx="282.0" cy="186.0" rx="10" ry="10" fill="url(#rdGlint)" opacity="0.45"/>
  </g>

  <!-- polished arris along the top, ground edge along the bottom -->
  <path d="M10.0 7.5H282.0" stroke="url(#rdArris)" stroke-width="1"/>
  <path d="M10.0 188.5H282.0" stroke="#dde8ef" stroke-width="1"
        opacity="0.3"/>
  <path d="M10.00 7.00H282.00A3.00 3.00 0 0 1 285.00 10.00V186.00A3.00 3.00 0 0 1 282.00 189.00H10.00A3.00 3.00 0 0 1 7.00 186.00V10.00A3.00 3.00 0 0 1 10.00 7.00Z" fill="none" stroke="url(#rdIris)" stroke-width="0.9"
        opacity="0.6"/>
  <path d="M17 28 H275"
        stroke="url(#rdIrisSoft)" stroke-width="0.6" opacity="0.75"/>
  <g class="t">
    <circle cx="22" cy="19" r="2.6" fill="none" stroke="#0e7490" stroke-width="0.45"/>
    <circle cx="22" cy="19" r="0.9" fill="#0e7490"/>
    <text x="31" y="22" fill="#0e7490" font-size="7.4" letter-spacing="2.8">WEEKLY RHYTHM</text>
    <text x="271" y="22" fill="#5d8ba0" font-size="6.8" letter-spacing="1.8"
          text-anchor="end">PEAK TUE</text>
  </g>
<g clip-path="url(#rdInner)">

  <defs>
    <radialGradient id="rdWedge" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g class="t">
    <circle cx="146.0" cy="112.5" r="19.7" fill="none" stroke="#5d8ba0" stroke-width="0.45" opacity="0.4"/><circle cx="146.0" cy="112.5" r="32.5" fill="none" stroke="#5d8ba0" stroke-width="0.45" opacity="0.7"/><circle cx="146.0" cy="112.5" r="45.2" fill="none" stroke="#5d8ba0" stroke-width="0.45" opacity="0.4"/><circle cx="146.0" cy="112.5" r="58.0" fill="none" stroke="#5d8ba0" stroke-width="0.45" opacity="0.7"/>
    <path d="M146.0 112.5 L134.2 86.7 A28.4 28.4 0 0 1 157.8 86.7 Z" fill="#0e7490" opacity="0.30" stroke="#0e7490" stroke-width="0.45"/><path d="M146.0 112.5 L154.1 96.6 A17.9 17.9 0 0 1 163.3 108.2 Z" fill="#0e7490" opacity="0.21" stroke="#0e7490" stroke-width="0.45"/><path d="M146.0 112.5 L202.8 100.8 A58.0 58.0 0 0 1 192.1 147.7 Z" fill="#0e7490" opacity="0.54" stroke="#0e7490" stroke-width="0.45"/><path d="M146.0 112.5 L168.6 131.3 A29.3 29.3 0 0 1 146.6 141.8 Z" fill="#0e7490" opacity="0.30" stroke="#0e7490" stroke-width="0.45"/><path d="M146.0 112.5 L145.1 153.3 A40.8 40.8 0 0 1 114.6 138.6 Z" fill="#0e7490" opacity="0.40" stroke="#0e7490" stroke-width="0.45"/><path d="M146.0 112.5 L121.2 131.5 A31.3 31.3 0 0 1 115.4 106.2 Z" fill="#0e7490" opacity="0.32" stroke="#0e7490" stroke-width="0.45"/><path d="M146.0 112.5 L134.2 109.5 A12.1 12.1 0 0 1 140.5 101.7 Z" fill="#0e7490" opacity="0.16" stroke="#0e7490" stroke-width="0.45"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="-90 146.0 112.5" to="270 146.0 112.5" dur="7s" repeatCount="indefinite"/>
      <path d="M146.0 112.5 L204.0 112.5 A58 58 0 0 0 186.3 70.8 Z" fill="url(#rdWedge)"/>
      <line x1="146.0" y1="112.5" x2="204.0" y2="112.5" stroke="#0e7490" stroke-width="0.7" filter="url(#rdGlow)"/>
    </g>
    <text x="146.0" y="43.7" fill="#5d8ba0" font-size="5.8" letter-spacing="1" text-anchor="middle">SUN</text><text x="146.0" y="51.1" fill="#5d8ba0" font-size="5.9" text-anchor="middle">20</text><text x="201.5" y="70.4" fill="#5d8ba0" font-size="5.8" letter-spacing="1" text-anchor="middle">MON</text><text x="201.5" y="77.8" fill="#5d8ba0" font-size="5.9" text-anchor="middle">9</text><text x="215.2" y="130.5" fill="#9a6a10" font-size="5.8" letter-spacing="1" text-anchor="middle">TUE</text><text x="215.2" y="137.9" fill="#1d4d61" font-size="5.9" text-anchor="middle">51</text><text x="176.8" y="178.7" fill="#5d8ba0" font-size="5.8" letter-spacing="1" text-anchor="middle">WED</text><text x="176.8" y="186.1" fill="#5d8ba0" font-size="5.9" text-anchor="middle">21</text><text x="115.2" y="178.7" fill="#5d8ba0" font-size="5.8" letter-spacing="1" text-anchor="middle">THU</text><text x="115.2" y="186.1" fill="#5d8ba0" font-size="5.9" text-anchor="middle">33</text><text x="76.8" y="130.5" fill="#5d8ba0" font-size="5.8" letter-spacing="1" text-anchor="middle">FRI</text><text x="76.8" y="137.9" fill="#5d8ba0" font-size="5.9" text-anchor="middle">23</text><text x="90.5" y="70.4" fill="#5d8ba0" font-size="5.8" letter-spacing="1" text-anchor="middle">SAT</text><text x="90.5" y="77.8" fill="#5d8ba0" font-size="5.9" text-anchor="middle">3</text>
    <circle cx="146.0" cy="112.5" r="1.8" fill="#9a6a10"/>
  </g>
  <rect x="7" y="28" width="278" height="161" fill="url(#rdScan)" opacity="0.2"/>
  <rect x="7" y="28" width="278" height="161" filter="url(#rdGrain)" opacity="0.09"/>
</g>
</svg>
