  <path d="M10 16 V10 H16" stroke="#0e7490" stroke-width="0.45" fill="none" opacity="0.7"/><path d="M276 10 H282 V16" stroke="#0e7490" stroke-width="0.45" fill="none" opacity="0.7"/><path d="M10 180 V186 H16" stroke="#0e7490" stroke-width="0.45" fill="none" opacity="0.7"/><path d="M276 186 H282 V180" stroke="#0e7490" stroke-width="0.45" fill="none" opacity="0.7"/>
  <g class="t">
    <circle cx="20" cy="17.6" r="2.6" fill="none" stroke="#0e7490" stroke-width="0.45"/>
    <circle cx="20" cy="17.6" r="0.9" fill="#0e7490"/>
    <text x="29" y="20.6" fill="#0e7490" font-size="7.4" letter-spacing="2.8">WEEKLY RHYTHM</text>
    <text x="277" y="20.6" fill="#5d8ba0" font-size="6.8" letter-spacing="1.8"
          text-anchor="end">PEAK TUE</text>
  </g>
<g clip-path="url(#rdInner)">

