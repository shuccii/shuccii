      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g class="t">
    <circle cx="146.0" cy="112.5" r="19.7" fill="none" stroke="#5d8ba0" stroke-width="0.45" opacity="0.4"/><circle cx="146.0" cy="112.5" r="32.5" fill="none" stroke="#5d8ba0" stroke-width="0.45" opacity="0.7"/><circle cx="146.0" cy="112.5" r="45.2" fill="none" stroke="#5d8ba0" stroke-width="0.45" opacity="0.4"/><circle cx="146.0" cy="112.5" r="58.0" fill="none" stroke="#5d8ba0" stroke-width="0.45" opacity="0.7"/>
    <path d="M146.0 112.5 L134.2 86.7 A28.4 28.4 0 0 1 157.8 86.7 Z" fill="#0e7490" opacity="0.30" stroke="#0e7490" stroke-width="0.45"/><path d="M146.0 112.5 L154.1 96.6 A17.9 17.9 0 0 1 163.3 108.2 Z" fill="#0e7490" opacity="0.21" stroke="#0e7490" stroke-width="0.45"/><path d="M146.0 112.5 L202.8 100.8 A58.0 58.0 0 0 1 192.1 147.7 Z" fill="#0e7490" opacity="0.54" stroke="#0e7490" stroke-width="0.45"/><path d="M146.0 112.5 L168.6 131.3 A29.3 29.3 0 0 1 146.6 141.8 Z" fill="#0e7490" opacity="0.30" stroke="#0e7490" stroke-width="0.45"/><path d="M146.0 112.5 L145.1 153.3 A40.8 40.8 0 0 1 114.6 138.6 Z" fill="#0e7490" opacity="0.40" stroke="#0e7490" stroke-width="0.45"/><path d="M146.0 112.5 L121.2 131.5 A31.3 31.3 0 0 1 115.4 106.2 Z" fill="#0e7490" opacity="0.32" stroke="#0e7490" stroke-width="0.45"/><path d="M146.0 112.5 L134.2 109.5 A12.1 12.1 0 0 1 140.5 101.7 Z" fill="#0e7490" opacity="0.16" stroke="#0e7490" stroke-width="0.45"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="-90 146.0 112.5" to="270 146.0 112.5" dur="7s" repeatCount="indefinite"/>
