<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 186" width="900" height="186" role="img" aria-label="recent commits">
<defs>
  <radialGradient id="lgDeep" cx="16%" cy="50%" r="88%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
    <stop offset="46%" stop-color="#eef4f8" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#dde8ef" stop-opacity="0.2"/>
  </radialGradient>
  <radialGradient id="lgVig" cx="50%" cy="50%" r="74%">
    <stop offset="58%" stop-color="#3d6b80" stop-opacity="0"/>
    <stop offset="100%" stop-color="#3d6b80" stop-opacity="0.16"/>
  </radialGradient>
  <radialGradient id="lgCore" cx="50%" cy="42%" r="58%"><stop offset="0%" stop-color="#ffffff" stop-opacity="1"/><stop offset="26%" stop-color="#dff2fa" stop-opacity="1"/><stop offset="60%" stop-color="#7cc6dd" stop-opacity="0.5"/><stop offset="100%" stop-color="#bcd9e5" stop-opacity="0"/></radialGradient>
  <linearGradient id="lgSweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0e7490" stop-opacity="0"/>
    <stop offset="52%" stop-color="#0e7490" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
  </linearGradient>
  <filter id="lgBevel" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="hh"/>
    <feSpecularLighting in="hh" surfaceScale="3.6" specularConstant="0.85"
                        specularExponent="26" lighting-color="#dff6ff" result="s">
      <fePointLight x="-70" y="-70" z="60">
        <animate attributeName="x" values="-70;70;-70" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-70;70;-70" dur="13s" repeatCount="indefinite"/>
      </fePointLight>
    </feSpecularLighting>
    <feComposite in="s" in2="SourceAlpha" operator="in" result="sc"/>
    <feComposite in="SourceGraphic" in2="sc" operator="arithmetic" k1="0" k2="1" k3="0.41" k4="0"/>
  </filter>
  <filter id="lgGlow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="0.41" result="a"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="1.62" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="lgGrain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="5" result="n">
      <animate attributeName="seed" values="5;13;21;5" dur="1.3s" calcMode="discrete" repeatCount="indefinite"/>
    </feTurbulence>
    <feColorMatrix in="n" type="matrix"
      values="0 0 0 0 0.12  0 0 0 0 0.66  0 0 0 0 0.8  0 0 0 0.06 0"/>
  </filter>
  <pattern id="lgScan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="0.8" fill="#9dbccb" opacity="0.16"/>
  </pattern>
  <clipPath id="lgClip"><rect width="900" height="186" rx="3"/></clipPath>
  <style>.t{font-family:"SFMono-Regular","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;}</style>
  <!-- Fresnel: transparent looking straight through, reflective at the edges -->
  <linearGradient id="lgFace" x1="0.12" y1="0" x2="0.55" y2="1">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.4"/>
    <stop offset="46%"  stop-color="#eef4f8"   stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#dde8ef" stop-opacity="0.30"/>
  </linearGradient>
  <linearGradient id="lgEdgeV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.55"/>
    <stop offset="14%"  stop-color="#eef4f8"   stop-opacity="0"/>
    <stop offset="86%"  stop-color="#dde8ef" stop-opacity="0"/>
    <stop offset="100%" stop-color="#dde8ef" stop-opacity="0.34"/>
  </linearGradient>

  <!-- dispersion: the hues travel along the edge, so the colour itself flows -->
  <linearGradient id="lgIris" x1="0" y1="0" x2="1" y2="0.35"
                  gradientUnits="objectBoundingBox">
    <stop offset="0.00" stop-color="#2aa6c4"/>
    <stop offset="0.26" stop-color="#3fc9a8"/>
    <stop offset="0.48" stop-color="#ffffff"/>
    <stop offset="0.71" stop-color="#8f7ae0"/>
    <stop offset="1.00" stop-color="#e0a54a"/>
    <animate attributeName="x1" values="-1;0;1" dur="19s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;1;2" dur="19s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="lgIrisSoft" x1="0" y1="0" x2="1" y2="0.6">
    <stop offset="0.00" stop-color="#3fc9a8" stop-opacity="0.36"/>
    <stop offset="0.34" stop-color="#ffffff" stop-opacity="0.28"/>
    <stop offset="0.62" stop-color="#8f7ae0" stop-opacity="0.32"/>
    <stop offset="1.00" stop-color="#2aa6c4" stop-opacity="0.3"/>
    <animate attributeName="x1" values="-0.8;0.2;1.2" dur="26s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0.2;1.2;2.2" dur="26s" repeatCount="indefinite"/>
  </linearGradient>

  <!-- the polished top arris, and the ground bottom one -->
  <linearGradient id="lgArris" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="8%"   stop-color="#ffffff" stop-opacity="0.95"/>
    <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="lgSheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.72"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>

  <!-- a corner glint: light funnelled into the 90-degree arris -->
  <radialGradient id="lgGlint" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
    <stop offset="38%"  stop-color="#ffffff" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>

  <filter id="lgCast" x="-14%" y="-14%" width="128%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="4.5"
                  flood-color="#26495c"
                  flood-opacity="0.32"/>
  </filter>
  <filter id="lgCaustic" x="-40%" y="-60%" width="180%" height="260%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <clipPath id="lgShape"><path d="M10.00 7.00H890.00A3.00 3.00 0 0 1 893.00 10.00V176.00A3.00 3.00 0 0 1 890.00 179.00H10.00A3.00 3.00 0 0 1 7.00 176.00V10.00A3.00 3.00 0 0 1 10.00 7.00Z"/></clipPath>
  <clipPath id="lgInner"><path d="M10.00 28.00H890.00A3.00 3.00 0 0 1 893.00 31.00V176.00A3.00 3.00 0 0 1 890.00 179.00H10.00A3.00 3.00 0 0 1 7.00 176.00V31.00A3.00 3.00 0 0 1 10.00 28.00Z"/></clipPath>
</defs>


  <path d="M10.00 7.00H890.00A3.00 3.00 0 0 1 893.00 10.00V176.00A3.00 3.00 0 0 1 890.00 179.00H10.00A3.00 3.00 0 0 1 7.00 176.00V10.00A3.00 3.00 0 0 1 10.00 7.00Z" fill="#dde8ef" opacity="0.26" filter="url(#lgCast)"/>
  <rect x="148.8" y="181.0" width="602.5" height="7"
        fill="url(#lgIrisSoft)" opacity="0.42" filter="url(#lgCaustic)"/>

  <path d="M10.00 7.00H890.00A3.00 3.00 0 0 1 893.00 10.00V176.00A3.00 3.00 0 0 1 890.00 179.00H10.00A3.00 3.00 0 0 1 7.00 176.00V10.00A3.00 3.00 0 0 1 10.00 7.00Z" fill="url(#lgFace)"/>
  <path d="M10.00 7.00H890.00A3.00 3.00 0 0 1 893.00 10.00V176.00A3.00 3.00 0 0 1 890.00 179.00H10.00A3.00 3.00 0 0 1 7.00 176.00V10.00A3.00 3.00 0 0 1 10.00 7.00Z" fill="url(#lgEdgeV)"/>

  <!-- edge band: dispersion strongest where the sheet is seen at a grazing angle -->
  <g clip-path="url(#lgShape)">
    <path d="M10.00 7.00H890.00A3.00 3.00 0 0 1 893.00 10.00V176.00A3.00 3.00 0 0 1 890.00 179.00H10.00A3.00 3.00 0 0 1 7.00 176.00V10.00A3.00 3.00 0 0 1 10.00 7.00Z" fill="none"
          stroke="url(#lgIrisSoft)" stroke-width="18"
          opacity="0.2"/>
    <rect x="-436.0" y="7" width="443.0" height="172"
          fill="url(#lgSheen)" opacity="0.34" transform="skewX(-12)">
      <animate attributeName="x" values="-480.3;981.6" dur="17s" repeatCount="indefinite"/>
    </rect>
    <ellipse cx="10.0" cy="10.0" rx="10" ry="10" fill="url(#lgGlint)" opacity="0.7"/><ellipse cx="890.0" cy="10.0" rx="10" ry="10" fill="url(#lgGlint)" opacity="0.4"/><ellipse cx="10.0" cy="176.0" rx="10" ry="10" fill="url(#lgGlint)" opacity="0.28"/><ellipse cx="890.0" cy="176.0" rx="10" ry="10" fill="url(#lgGlint)" opacity="0.45"/>
  </g>

  <!-- polished arris along the top, ground edge along the bottom -->
  <path d="M10.0 7.5H890.0" stroke="url(#lgArris)" stroke-width="1"/>
  <path d="M10.0 178.5H890.0" stroke="#dde8ef" stroke-width="1"
        opacity="0.3"/>
  <path d="M10.00 7.00H890.00A3.00 3.00 0 0 1 893.00 10.00V176.00A3.00 3.00 0 0 1 890.00 179.00H10.00A3.00 3.00 0 0 1 7.00 176.00V10.00A3.00 3.00 0 0 1 10.00 7.00Z" fill="none" stroke="url(#lgIris)" stroke-width="0.9"
        opacity="0.6"/>
  <path d="M17 28 H883"
        stroke="url(#lgIrisSoft)" stroke-width="0.6" opacity="0.75"/>
  <g class="t">
    <circle cx="22" cy="19" r="2.6" fill="none" stroke="#0e7490" stroke-width="0.45"/>
    <circle cx="22" cy="19" r="0.9" fill="#0e7490"/>
    <text x="31" y="22" fill="#0e7490" font-size="7.4" letter-spacing="2.8">COMMIT STREAM</text>
    <text x="879" y="22" fill="#5d8ba0" font-size="6.8" letter-spacing="1.8"
          text-anchor="end">9 RECENT</text>
  </g>
<g clip-path="url(#lgInner)">

  <g class="t">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -153"
                        dur="23s" calcMode="linear" repeatCount="indefinite"/>
