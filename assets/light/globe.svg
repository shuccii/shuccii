  <linearGradient id="glLip" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="18%" stop-color="#ffffff" stop-opacity="0.9"/>
    <stop offset="82%" stop-color="#ffffff" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <filter id="glDrop" x="-12%" y="-12%" width="124%" height="130%">
    <feDropShadow dx="0" dy="2.4" stdDeviation="3.4"
