        <animate attributeName="rx" values="58;0;58" dur="16s" begin="-13.33s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.16;0.75;0.16" dur="16s" begin="-13.33s" repeatCount="indefinite"/>
      </ellipse>
    <circle cx="146.0" cy="110.5" r="67" fill="none" stroke="#5d8ba0" stroke-width="0.45"
