      <ellipse cx="146.0" cy="110.5" ry="58" fill="none" stroke="#5d8ba0" stroke-width="0.45" opacity="0.7">
        <animate attributeName="rx" values="58;0;58" dur="16s" begin="0.00s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.16;0.75;0.16" dur="16s" begin="0.00s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="146.0" cy="110.5" ry="58" fill="none" stroke="#5d8ba0" stroke-width="0.45" opacity="0.7">
