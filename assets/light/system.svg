      </rect>
    </g>
    <text x="19" y="143.5" fill="#1d4d61" font-size="6.8" letter-spacing="0.6">JARVIS</text>
    <text x="273" y="143.5" fill="#5d8ba0" font-size="6.1" text-anchor="end">08-20</text>
    <rect x="19" y="147.5" width="254" height="3" rx="1.5" fill="#c2d6e0" opacity="0.75"/>
