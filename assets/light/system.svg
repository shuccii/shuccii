<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 292 196" width="292" height="196" role="img" aria-label="repositories by last push">
<defs>
  <radialGradient id="syDeep" cx="16%" cy="50%" r="88%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
    <stop offset="46%" stop-color="#eef4f8" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#dde8ef" stop-opacity="0.2"/>
  </radialGradient>
  <radialGradient id="syVig" cx="50%" cy="50%" r="74%">
    <stop offset="58%" stop-color="#3d6b80" stop-opacity="0"/>
    <stop offset="100%" stop-color="#3d6b80" stop-opacity="0.16"/>
  </radialGradient>
  <radialGradient id="syCore" cx="50%" cy="42%" r="58%"><stop offset="0%" stop-color="#ffffff" stop-opacity="1"/><stop offset="26%" stop-color="#dff2fa" stop-opacity="1"/><stop offset="60%" stop-color="#7cc6dd" stop-opacity="0.5"/><stop offset="100%" stop-color="#bcd9e5" stop-opacity="0"/></radialGradient>
  <linearGradient id="sySweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0e7490" stop-opacity="0"/>
    <stop offset="52%" stop-color="#0e7490" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
  </linearGradient>
  <filter id="syBevel" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="hh"/>
    <feSpecularLighting in="hh" surfaceScale="3.6" specularConstant="0.85"
                        specularExponent="26" lighting-color="#dff6ff" result="s">
      <fePointLight x="-70" y="-70" z="60">
        <animate attributeName="x" values="-70;70;-70" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-70;70;-70" dur="13s" repeatCount="indefinite"/>
      </fePointLight>
    </feSpecularLighting>
    <feComposite in="s" in2="SourceAlpha" operator="in" result="sc"/>
    <feComposite in="SourceGraphic" in2="sc" operator="arithmetic" k1="0" k2="1" k3="0.41" k4="0"/>
  </filter>
  <filter id="syGlow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="0.41" result="a"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="1.62" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="syGrain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="5" result="n">
      <animate attributeName="seed" values="5;13;21;5" dur="1.3s" calcMode="discrete" repeatCount="indefinite"/>
    </feTurbulence>
    <feColorMatrix in="n" type="matrix"
      values="0 0 0 0 0.12  0 0 0 0 0.66  0 0 0 0 0.8  0 0 0 0.06 0"/>
  </filter>
  <pattern id="syScan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="0.8" fill="#9dbccb" opacity="0.16"/>
  </pattern>
  <clipPath id="syClip"><rect width="292" height="196" rx="3"/></clipPath>
  <style>.t{font-family:"SFMono-Regular","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;}</style>
  <!-- Fresnel: transparent looking straight through, reflective at the edges -->
  <linearGradient id="syFace" x1="0.12" y1="0" x2="0.55" y2="1">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.4"/>
    <stop offset="46%"  stop-color="#eef4f8"   stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#dde8ef" stop-opacity="0.30"/>
  </linearGradient>
  <linearGradient id="syEdgeV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.55"/>
    <stop offset="14%"  stop-color="#eef4f8"   stop-opacity="0"/>
    <stop offset="86%"  stop-color="#dde8ef" stop-opacity="0"/>
    <stop offset="100%" stop-color="#dde8ef" stop-opacity="0.34"/>
  </linearGradient>

  <!-- dispersion: the hues travel along the edge, so the colour itself flows -->
  <linearGradient id="syIris" x1="0" y1="0" x2="1" y2="0.35"
                  gradientUnits="objectBoundingBox">
    <stop offset="0.00" stop-color="#2aa6c4"/>
    <stop offset="0.26" stop-color="#3fc9a8"/>
    <stop offset="0.48" stop-color="#ffffff"/>
    <stop offset="0.71" stop-color="#8f7ae0"/>
    <stop offset="1.00" stop-color="#e0a54a"/>
    <animate attributeName="x1" values="-1;0;1" dur="19s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;1;2" dur="19s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="syIrisSoft" x1="0" y1="0" x2="1" y2="0.6">
    <stop offset="0.00" stop-color="#3fc9a8" stop-opacity="0.36"/>
    <stop offset="0.34" stop-color="#ffffff" stop-opacity="0.28"/>
    <stop offset="0.62" stop-color="#8f7ae0" stop-opacity="0.32"/>
    <stop offset="1.00" stop-color="#2aa6c4" stop-opacity="0.3"/>
    <animate attributeName="x1" values="-0.8;0.2;1.2" dur="26s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0.2;1.2;2.2" dur="26s" repeatCount="indefinite"/>
  </linearGradient>

  <!-- the polished top arris, and the ground bottom one -->
  <linearGradient id="syArris" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="8%"   stop-color="#ffffff" stop-opacity="0.95"/>
    <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="sySheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.72"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>

  <!-- a corner glint: light funnelled into the 90-degree arris -->
  <radialGradient id="syGlint" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
    <stop offset="38%"  stop-color="#ffffff" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>

  <filter id="syCast" x="-14%" y="-14%" width="128%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="4.5"
                  flood-color="#26495c"
                  flood-opacity="0.32"/>
  </filter>
  <filter id="syCaustic" x="-40%" y="-60%" width="180%" height="260%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <clipPath id="syShape"><path d="M10.00 7.00H282.00A3.00 3.00 0 0 1 285.00 10.00V186.00A3.00 3.00 0 0 1 282.00 189.00H10.00A3.00 3.00 0 0 1 7.00 186.00V10.00A3.00 3.00 0 0 1 10.00 7.00Z"/></clipPath>
  <clipPath id="syInner"><path d="M10.00 28.00H282.00A3.00 3.00 0 0 1 285.00 31.00V186.00A3.00 3.00 0 0 1 282.00 189.00H10.00A3.00 3.00 0 0 1 7.00 186.00V31.00A3.00 3.00 0 0 1 10.00 28.00Z"/></clipPath>
</defs>


  <path d="M10.00 7.00H282.00A3.00 3.00 0 0 1 285.00 10.00V186.00A3.00 3.00 0 0 1 282.00 189.00H10.00A3.00 3.00 0 0 1 7.00 186.00V10.00A3.00 3.00 0 0 1 10.00 7.00Z" fill="#dde8ef" opacity="0.26" filter="url(#syCast)"/>
  <rect x="51.5" y="191.0" width="189.0" height="7"
        fill="url(#syIrisSoft)" opacity="0.42" filter="url(#syCaustic)"/>

  <path d="M10.00 7.00H282.00A3.00 3.00 0 0 1 285.00 10.00V186.00A3.00 3.00 0 0 1 282.00 189.00H10.00A3.00 3.00 0 0 1 7.00 186.00V10.00A3.00 3.00 0 0 1 10.00 7.00Z" fill="url(#syFace)"/>
  <path d="M10.00 7.00H282.00A3.00 3.00 0 0 1 285.00 10.00V186.00A3.00 3.00 0 0 1 282.00 189.00H10.00A3.00 3.00 0 0 1 7.00 186.00V10.00A3.00 3.00 0 0 1 10.00 7.00Z" fill="url(#syEdgeV)"/>

  <!-- edge band: dispersion strongest where the sheet is seen at a grazing angle -->
  <g clip-path="url(#syShape)">
    <path d="M10.00 7.00H282.00A3.00 3.00 0 0 1 285.00 10.00V186.00A3.00 3.00 0 0 1 282.00 189.00H10.00A3.00 3.00 0 0 1 7.00 186.00V10.00A3.00 3.00 0 0 1 10.00 7.00Z" fill="none"
          stroke="url(#syIrisSoft)" stroke-width="18"
          opacity="0.2"/>
    <rect x="-132.0" y="7" width="139.0" height="182"
          fill="url(#sySheen)" opacity="0.34" transform="skewX(-12)">
      <animate attributeName="x" values="-145.9;312.8" dur="17s" repeatCount="indefinite"/>
    </rect>
    <ellipse cx="10.0" cy="10.0" rx="10" ry="10" fill="url(#syGlint)" opacity="0.7"/><ellipse cx="282.0" cy="10.0" rx="10" ry="10" fill="url(#syGlint)" opacity="0.4"/><ellipse cx="10.0" cy="186.0" rx="10" ry="10" fill="url(#syGlint)" opacity="0.28"/><ellipse cx="282.0" cy="186.0" rx="10" ry="10" fill="url(#syGlint)" opacity="0.45"/>
  </g>

  <!-- polished arris along the top, ground edge along the bottom -->
  <path d="M10.0 7.5H282.0" stroke="url(#syArris)" stroke-width="1"/>
  <path d="M10.0 188.5H282.0" stroke="#dde8ef" stroke-width="1"
        opacity="0.3"/>
  <path d="M10.00 7.00H282.00A3.00 3.00 0 0 1 285.00 10.00V186.00A3.00 3.00 0 0 1 282.00 189.00H10.00A3.00 3.00 0 0 1 7.00 186.00V10.00A3.00 3.00 0 0 1 10.00 7.00Z" fill="none" stroke="url(#syIris)" stroke-width="0.9"
        opacity="0.6"/>
  <path d="M17 28 H275"
        stroke="url(#syIrisSoft)" stroke-width="0.6" opacity="0.75"/>
  <g class="t">
    <circle cx="22" cy="19" r="2.6" fill="none" stroke="#0e7490" stroke-width="0.45"/>
    <circle cx="22" cy="19" r="0.9" fill="#0e7490"/>
    <text x="31" y="22" fill="#0e7490" font-size="7.4" letter-spacing="2.8">REPOSITORY INDEX</text>
    <text x="271" y="22" fill="#5d8ba0" font-size="6.8" letter-spacing="1.8"
          text-anchor="end">3 PUBLIC</text>
  </g>
<g clip-path="url(#syInner)">

