      </rect>
    </g>
    <text x="19" y="123.0" fill="#1d4d61" font-size="6.8" letter-spacing="0.6">Data_SciencePBL</text>
    <text x="273" y="123.0" fill="#5d8ba0" font-size="6.1" text-anchor="end">08-20</text>
    <rect x="19" y="127.0" width="254" height="3" rx="1.5" fill="#c2d6e0" opacity="0.75"/>
    <rect x="19" y="127.0" width="30.5" height="3" rx="1.5" fill="#0e7490" opacity="0.85"/>
    <rect x="19" y="127.0" width="30.5" height="0.9" rx="0.5" fill="#ffffff" opacity="0.22"/>
    <g clip-path="url(#syBar4)">
