    <rect x="19" y="45.0" width="254" height="3" rx="1.5" fill="#c2d6e0" opacity="0.75"/>
    <rect x="19" y="45.0" width="254.0" height="3" rx="1.5" fill="#0e7490" opacity="0.85"/>
    <rect x="19" y="45.0" width="254.0" height="0.9" rx="0.5" fill="#ffffff" opacity="0.22"/>
