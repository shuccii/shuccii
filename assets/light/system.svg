    </g>
    <text x="19" y="82.0" fill="#1d4d61" font-size="6.8" letter-spacing="0.6">WADACHI</text>
    <text x="273" y="82.0" fill="#5d8ba0" font-size="6.1" text-anchor="end">09-02</text>
    <rect x="19" y="86.0" width="254" height="3" rx="1.5" fill="#c2d6e0" opacity="0.75"/>
    <rect x="19" y="86.0" width="183.4" height="3" rx="1.5" fill="#0e7490" opacity="0.85"/>
    <rect x="19" y="86.0" width="183.4" height="0.9" rx="0.5" fill="#ffffff" opacity="0.22"/>
    <g clip-path="url(#syBar2)">
      <rect y="86.0" width="26" height="3" rx="1.5" fill="#0b5570" opacity="0.5">
        <animate attributeName="x" values="-7;202.4" dur="2.6s"
                 begin="0.84s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="19" y="102.5" fill="#1d4d61" font-size="6.8" letter-spacing="0.6">shuccii.github.io</text>
    <text x="273" y="102.5" fill="#5d8ba0" font-size="6.1" text-anchor="end">08-30</text>
    <rect x="19" y="106.5" width="254" height="3" rx="1.5" fill="#c2d6e0" opacity="0.75"/>
    <rect x="19" y="106.5" width="141.1" height="3" rx="1.5" fill="#0e7490" opacity="0.85"/>
    <rect x="19" y="106.5" width="141.1" height="0.9" rx="0.5" fill="#ffffff" opacity="0.22"/>
    <g clip-path="url(#syBar3)">
      <rect y="106.5" width="26" height="3" rx="1.5" fill="#0b5570" opacity="0.5">
        <animate attributeName="x" values="-7;160.1" dur="2.6s"
