<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 54" width="900" height="54" role="img" aria-label="git status readout">
<defs>
  <radialGradient id="cDeep" cx="16%" cy="50%" r="88%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
    <stop offset="46%" stop-color="#eef4f8" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#dde8ef" stop-opacity="0.2"/>
  </radialGradient>
  <radialGradient id="cVig" cx="50%" cy="50%" r="74%">
    <stop offset="58%" stop-color="#3d6b80" stop-opacity="0"/>
    <stop offset="100%" stop-color="#3d6b80" stop-opacity="0.16"/>
  </radialGradient>
  <radialGradient id="cCore" cx="50%" cy="42%" r="58%"><stop offset="0%" stop-color="#ffffff" stop-opacity="1"/><stop offset="26%" stop-color="#dff2fa" stop-opacity="1"/><stop offset="60%" stop-color="#7cc6dd" stop-opacity="0.5"/><stop offset="100%" stop-color="#bcd9e5" stop-opacity="0"/></radialGradient>
  <linearGradient id="cSweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0e7490" stop-opacity="0"/>
    <stop offset="52%" stop-color="#0e7490" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
  </linearGradient>
  <filter id="cBevel" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="hh"/>
    <feSpecularLighting in="hh" surfaceScale="3.6" specularConstant="0.85"
                        specularExponent="26" lighting-color="#dff6ff" result="s">
      <fePointLight x="-70" y="-70" z="60">
        <animate attributeName="x" values="-70;70;-70" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-70;70;-70" dur="13s" repeatCount="indefinite"/>
      </fePointLight>
    </feSpecularLighting>
    <feComposite in="s" in2="SourceAlpha" operator="in" result="sc"/>
    <feComposite in="SourceGraphic" in2="sc" operator="arithmetic" k1="0" k2="1" k3="0.41" k4="0"/>
  </filter>
  <filter id="cGlow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="0.41" result="a"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="1.62" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="cGrain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="5" result="n">
      <animate attributeName="seed" values="5;13;21;5" dur="1.3s" calcMode="discrete" repeatCount="indefinite"/>
    </feTurbulence>
    <feColorMatrix in="n" type="matrix"
      values="0 0 0 0 0.12  0 0 0 0 0.66  0 0 0 0 0.8  0 0 0 0.06 0"/>
  </filter>
  <pattern id="cScan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="0.8" fill="#9dbccb" opacity="0.16"/>
  </pattern>
  <clipPath id="cClip"><rect width="900" height="54" rx="3"/></clipPath>
  <style>.t{font-family:"SFMono-Regular","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;}</style>
  <!-- Fresnel: transparent looking straight through, reflective at the edges -->
  <linearGradient id="cFace" x1="0.12" y1="0" x2="0.55" y2="1">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.4"/>
    <stop offset="46%"  stop-color="#eef4f8"   stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#dde8ef" stop-opacity="0.30"/>
  </linearGradient>
  <linearGradient id="cEdgeV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.55"/>
    <stop offset="14%"  stop-color="#eef4f8"   stop-opacity="0"/>
    <stop offset="86%"  stop-color="#dde8ef" stop-opacity="0"/>
    <stop offset="100%" stop-color="#dde8ef" stop-opacity="0.34"/>
  </linearGradient>

  <!-- dispersion: the hues travel along the edge, so the colour itself flows -->
  <linearGradient id="cIris" x1="0" y1="0" x2="1" y2="0.35"
                  gradientUnits="objectBoundingBox">
    <stop offset="0.00" stop-color="#2aa6c4"/>
    <stop offset="0.26" stop-color="#3fc9a8"/>
    <stop offset="0.48" stop-color="#ffffff"/>
    <stop offset="0.71" stop-color="#8f7ae0"/>
    <stop offset="1.00" stop-color="#e0a54a"/>
    <animate attributeName="x1" values="-1;0;1" dur="19s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;1;2" dur="19s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="cIrisSoft" x1="0" y1="0" x2="1" y2="0.6">
    <stop offset="0.00" stop-color="#3fc9a8" stop-opacity="0.36"/>
    <stop offset="0.34" stop-color="#ffffff" stop-opacity="0.28"/>
    <stop offset="0.62" stop-color="#8f7ae0" stop-opacity="0.32"/>
    <stop offset="1.00" stop-color="#2aa6c4" stop-opacity="0.3"/>
    <animate attributeName="x1" values="-0.8;0.2;1.2" dur="26s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0.2;1.2;2.2" dur="26s" repeatCount="indefinite"/>
  </linearGradient>

  <!-- the polished top arris, and the ground bottom one -->
  <linearGradient id="cArris" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="8%"   stop-color="#ffffff" stop-opacity="0.95"/>
    <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="cSheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.72"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>

  <!-- a corner glint: light funnelled into the 90-degree arris -->
  <radialGradient id="cGlint" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
    <stop offset="38%"  stop-color="#ffffff" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>

  <filter id="cCast" x="-14%" y="-14%" width="128%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="4.5"
                  flood-color="#26495c"
                  flood-opacity="0.32"/>
  </filter>
  <filter id="cCaustic" x="-40%" y="-60%" width="180%" height="260%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <clipPath id="cShape"><path d="M7.00 7.00H893.00V47.00H7.00Z"/></clipPath></defs>

  <path d="M7.00 7.00H893.00V47.00H7.00Z" fill="#dde8ef" opacity="0.26" filter="url(#cCast)"/>
  <rect x="148.8" y="49.0" width="602.5" height="7"
        fill="url(#cIrisSoft)" opacity="0.42" filter="url(#cCaustic)"/>

  <path d="M7.00 7.00H893.00V47.00H7.00Z" fill="url(#cFace)"/>
  <path d="M7.00 7.00H893.00V47.00H7.00Z" fill="url(#cEdgeV)"/>

  <!-- edge band: dispersion strongest where the sheet is seen at a grazing angle -->
  <g clip-path="url(#cShape)">
    <rect x="7" y="7" width="886" height="40" fill="none"
          stroke="url(#cIrisSoft)" stroke-width="18"
          opacity="0.2"/>
    <rect x="-436.0" y="7" width="443.0" height="40"
          fill="url(#cSheen)" opacity="0.34" transform="skewX(-12)">
      <animate attributeName="x" values="-480.3;981.6" dur="17s" repeatCount="indefinite"/>
    </rect>
    <ellipse cx="7" cy="7" rx="10" ry="10" fill="url(#cGlint)" opacity="0.7"/><ellipse cx="893" cy="7" rx="10" ry="10" fill="url(#cGlint)" opacity="0.4"/><ellipse cx="7" cy="47" rx="10" ry="10" fill="url(#cGlint)" opacity="0.28"/><ellipse cx="893" cy="47" rx="10" ry="10" fill="url(#cGlint)" opacity="0.45"/>
  </g>

  <!-- polished arris along the top, ground edge along the bottom -->
  <path d="M7.5 7.5H892.5" stroke="url(#cArris)" stroke-width="1"/>
  <path d="M7.5 46.5H892.5" stroke="#dde8ef" stroke-width="1"
        opacity="0.3"/>
  <path d="M7.00 7.00H893.00V47.00H7.00Z" fill="none" stroke="url(#cIris)" stroke-width="0.9"
        opacity="0.6"/>
<g clip-path="url(#cShape)">
  <line x1="78" y1="10" x2="78" y2="44" stroke="#5d8ba0" stroke-width="0.45" opacity="0.6"/>
  <text class="t" x="24" y="22" fill="#9a6a10" font-size="9.2" letter-spacing="1.6">SHELL</text>
  <text class="t" x="24" y="40" fill="#5d8ba0" font-size="9.2" letter-spacing="1.6">STDOUT</text>
  <g class="t">
    <g opacity="1"><animate attributeName="opacity" dur="14.4s" calcMode="discrete" keyTimes="0.0000;0.2500;0.5000;0.7500" values="1;0;0;0" repeatCount="indefinite"/><text x="96" y="22" fill="#1d4d61" font-size="11.5" letter-spacing="0.4">git remote -v</text><text x="96" y="40" fill="#0b5570" font-size="11.5" letter-spacing="0.4">origin  github.com/shuccii/shuccii  (fetch)</text></g>
    <g opacity="0"><animate attributeName="opacity" dur="14.4s" calcMode="discrete" keyTimes="0.0000;0.2500;0.5000;0.7500" values="0;1;0;0" repeatCount="indefinite"/><text x="96" y="22" fill="#1d4d61" font-size="11.5" letter-spacing="0.4">git log -1 --format=%h%d</text><text x="96" y="40" fill="#0b5570" font-size="11.5" letter-spacing="0.4">1f4cabc  (HEAD -> main, origin/main)</text></g>
    <g opacity="0"><animate attributeName="opacity" dur="14.4s" calcMode="discrete" keyTimes="0.0000;0.2500;0.5000;0.7500" values="0;0;1;0" repeatCount="indefinite"/><text x="96" y="22" fill="#1d4d61" font-size="11.5" letter-spacing="0.4">git shortlog -sn --since=1.year</text><text x="96" y="40" fill="#0b5570" font-size="11.5" letter-spacing="0.4">157  Shuichi Tani</text></g>
    <g opacity="0"><animate attributeName="opacity" dur="14.4s" calcMode="discrete" keyTimes="0.0000;0.2500;0.5000;0.7500" values="0;0;0;1" repeatCount="indefinite"/><text x="96" y="22" fill="#1d4d61" font-size="11.5" letter-spacing="0.4">gh api /users/shuccii --jq .public_repos</text><text x="96" y="40" fill="#0b5570" font-size="11.5" letter-spacing="0.4">3</text></g>
  </g>
  <rect x="854" y="21" width="6" height="12" fill="#9a6a10">
    <animate attributeName="opacity" values="1;1;0.1;0.1" keyTimes="0;0.5;0.55;1" dur="1.6s" repeatCount="indefinite"/>
  </rect>
  <circle cx="876" cy="27" r="3" fill="#0e7490" filter="url(#cGlow)">
    <animate attributeName="opacity" values="0.95;0.3;0.95" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <rect x="-300" y="0" width="300" height="54" fill="url(#cSweep)" opacity="0.07">
    <animate attributeName="x" values="-300;900" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect width="900" height="54" fill="url(#cScan)" opacity="0.34"/>
  <rect width="900" height="54" filter="url(#cGrain)" opacity="0.18"/>
  <rect width="900" height="54" fill="url(#cVig)"/>
</g>
</svg>
