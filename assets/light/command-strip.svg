<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 54" width="900" height="54" role="img" aria-label="git status readout">
<defs>
  <radialGradient id="cDeep" cx="16%" cy="50%" r="88%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.58"/>
    <stop offset="46%" stop-color="#eef4f8" stop-opacity="0.42"/>
    <stop offset="100%" stop-color="#dde8ef" stop-opacity="0.26"/>
  </radialGradient>
  <radialGradient id="cVig" cx="50%" cy="50%" r="74%">
    <stop offset="58%" stop-color="#3d6b80" stop-opacity="0"/>
    <stop offset="100%" stop-color="#3d6b80" stop-opacity="0.16"/>
  </radialGradient>
  <radialGradient id="cCore" cx="50%" cy="42%" r="58%"><stop offset="0%" stop-color="#ffffff" stop-opacity="1"/><stop offset="26%" stop-color="#dff2fa" stop-opacity="1"/><stop offset="60%" stop-color="#7cc6dd" stop-opacity="0.5"/><stop offset="100%" stop-color="#bcd9e5" stop-opacity="0"/></radialGradient>
  <linearGradient id="cSweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0e7490" stop-opacity="0"/>
    <stop offset="52%" stop-color="#0e7490" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
  </linearGradient>
  <filter id="cBevel" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="hh"/>
    <feSpecularLighting in="hh" surfaceScale="3.6" specularConstant="0.85"
                        specularExponent="26" lighting-color="#dff6ff" result="s">
      <fePointLight x="-70" y="-70" z="60">
        <animate attributeName="x" values="-70;70;-70" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-70;70;-70" dur="13s" repeatCount="indefinite"/>
      </fePointLight>
    </feSpecularLighting>
    <feComposite in="s" in2="SourceAlpha" operator="in" result="sc"/>
    <feComposite in="SourceGraphic" in2="sc" operator="arithmetic" k1="0" k2="1" k3="0.41" k4="0"/>
  </filter>
  <filter id="cGlow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="0.41" result="a"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="1.62" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="cGrain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="5" result="n">
      <animate attributeName="seed" values="5;13;21;5" dur="1.3s" calcMode="discrete" repeatCount="indefinite"/>
    </feTurbulence>
    <feColorMatrix in="n" type="matrix"
      values="0 0 0 0 0.12  0 0 0 0 0.66  0 0 0 0 0.8  0 0 0 0.06 0"/>
  </filter>
  <pattern id="cScan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="0.8" fill="#9dbccb" opacity="0.16"/>
  </pattern>
  <clipPath id="cClip"><rect width="900" height="54" rx="3"/></clipPath>
  <style>.t{font-family:"SFMono-Regular","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;}</style></defs>
<g clip-path="url(#cClip)">
  <rect width="900" height="54" fill="url(#cDeep)"/>
  <line x1="78" y1="10" x2="78" y2="44" stroke="#5d8ba0" stroke-width="0.45" opacity="0.6"/>
  <text class="t" x="24" y="22" fill="#9a6a10" font-size="9.2" letter-spacing="1.6">SHELL</text>
  <text class="t" x="24" y="40" fill="#5d8ba0" font-size="9.2" letter-spacing="1.6">STDOUT</text>
  <g class="t">
    <g opacity="1"><animate attributeName="opacity" dur="14.4s" calcMode="discrete" keyTimes="0.0000;0.2500;0.5000;0.7500" values="1;0;0;0" repeatCount="indefinite"/><text x="96" y="22" fill="#1d4d61" font-size="11.5" letter-spacing="0.4">git remote -v</text><text x="96" y="40" fill="#0b5570" font-size="11.5" letter-spacing="0.4">origin  github.com/shuccii/shuccii  (fetch)</text></g>
    <g opacity="0"><animate attributeName="opacity" dur="14.4s" calcMode="discrete" keyTimes="0.0000;0.2500;0.5000;0.7500" values="0;1;0;0" repeatCount="indefinite"/><text x="96" y="22" fill="#1d4d61" font-size="11.5" letter-spacing="0.4">git log -1 --format=%h%d</text><text x="96" y="40" fill="#0b5570" font-size="11.5" letter-spacing="0.4">5d15f90  (HEAD -> HEAD, origin/HEAD)</text></g>
    <g opacity="0"><animate attributeName="opacity" dur="14.4s" calcMode="discrete" keyTimes="0.0000;0.2500;0.5000;0.7500" values="0;0;1;0" repeatCount="indefinite"/><text x="96" y="22" fill="#1d4d61" font-size="11.5" letter-spacing="0.4">git shortlog -sn --since=1.year</text><text x="96" y="40" fill="#0b5570" font-size="11.5" letter-spacing="0.4">157  Shuichi Tani</text></g>
    <g opacity="0"><animate attributeName="opacity" dur="14.4s" calcMode="discrete" keyTimes="0.0000;0.2500;0.5000;0.7500" values="0;0;0;1" repeatCount="indefinite"/><text x="96" y="22" fill="#1d4d61" font-size="11.5" letter-spacing="0.4">gh api /users/shuccii --jq .public_repos</text><text x="96" y="40" fill="#0b5570" font-size="11.5" letter-spacing="0.4">3</text></g>
  </g>
  <rect x="854" y="21" width="6" height="12" fill="#9a6a10">
    <animate attributeName="opacity" values="1;1;0.1;0.1" keyTimes="0;0.5;0.55;1" dur="1.6s" repeatCount="indefinite"/>
  </rect>
  <circle cx="876" cy="27" r="3" fill="#0e7490" filter="url(#cGlow)">
    <animate attributeName="opacity" values="0.95;0.3;0.95" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <rect x="-300" y="0" width="300" height="54" fill="url(#cSweep)" opacity="0.07">
    <animate attributeName="x" values="-300;900" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect width="900" height="54" fill="url(#cScan)" opacity="0.34"/>
  <rect width="900" height="54" filter="url(#cGrain)" opacity="0.18"/>
  <rect width="900" height="54" fill="url(#cVig)"/>
  <rect x="0.5" y="0.5" width="899" height="53" rx="3" fill="none" stroke="#5d8ba0" stroke-width="0.8" opacity="0.6"/>
</g>
</svg>
