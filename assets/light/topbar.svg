<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 44" width="900" height="44" role="img" aria-label="status bar">
<defs>
  <radialGradient id="tbDeep" cx="16%" cy="50%" r="88%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.58"/>
    <stop offset="46%" stop-color="#eef4f8" stop-opacity="0.42"/>
    <stop offset="100%" stop-color="#dde8ef" stop-opacity="0.26"/>
  </radialGradient>
  <radialGradient id="tbVig" cx="50%" cy="50%" r="74%">
    <stop offset="58%" stop-color="#3d6b80" stop-opacity="0"/>
    <stop offset="100%" stop-color="#3d6b80" stop-opacity="0.16"/>
  </radialGradient>
  <radialGradient id="tbCore" cx="50%" cy="42%" r="58%"><stop offset="0%" stop-color="#ffffff" stop-opacity="1"/><stop offset="26%" stop-color="#dff2fa" stop-opacity="1"/><stop offset="60%" stop-color="#7cc6dd" stop-opacity="0.5"/><stop offset="100%" stop-color="#bcd9e5" stop-opacity="0"/></radialGradient>
  <linearGradient id="tbSweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0e7490" stop-opacity="0"/>
    <stop offset="52%" stop-color="#0e7490" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
  </linearGradient>
  <filter id="tbBevel" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="hh"/>
    <feSpecularLighting in="hh" surfaceScale="3.6" specularConstant="0.85"
                        specularExponent="26" lighting-color="#dff6ff" result="s">
      <fePointLight x="-70" y="-70" z="60">
        <animate attributeName="x" values="-70;70;-70" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-70;70;-70" dur="13s" repeatCount="indefinite"/>
      </fePointLight>
    </feSpecularLighting>
    <feComposite in="s" in2="SourceAlpha" operator="in" result="sc"/>
    <feComposite in="SourceGraphic" in2="sc" operator="arithmetic" k1="0" k2="1" k3="0.41" k4="0"/>
  </filter>
  <filter id="tbGlow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="0.41" result="a"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="1.62" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="tbGrain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="5" result="n">
      <animate attributeName="seed" values="5;13;21;5" dur="1.3s" calcMode="discrete" repeatCount="indefinite"/>
    </feTurbulence>
    <feColorMatrix in="n" type="matrix"
      values="0 0 0 0 0.12  0 0 0 0 0.66  0 0 0 0 0.8  0 0 0 0.06 0"/>
  </filter>
  <pattern id="tbScan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="0.8" fill="#9dbccb" opacity="0.16"/>
  </pattern>
  <clipPath id="tbClip"><rect width="900" height="44" rx="3"/></clipPath>
  <style>.t{font-family:"SFMono-Regular","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;}</style>
  <linearGradient id="tbBody" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.58"/>
    <stop offset="52%" stop-color="#eef4f8" stop-opacity="0.42"/>
    <stop offset="100%" stop-color="#dde8ef" stop-opacity="0.26"/>
  </linearGradient>
  <linearGradient id="tbBar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0e7490" stop-opacity="0.13"/>
    <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="tbLip" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="18%" stop-color="#ffffff" stop-opacity="0.9"/>
    <stop offset="82%" stop-color="#ffffff" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <filter id="tbDrop" x="-12%" y="-12%" width="124%" height="130%">
    <feDropShadow dx="0" dy="2.4" stdDeviation="3.4"
                  flood-color="#33586b"
                  flood-opacity="0.22"/>
  </filter>
  <clipPath id="tbTick"><rect x="246" y="8" width="544" height="28"/></clipPath>
  <linearGradient id="tbFade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#eef4f8"/><stop offset="6%" stop-color="#eef4f8" stop-opacity="0"/>
    <stop offset="94%" stop-color="#eef4f8" stop-opacity="0"/><stop offset="100%" stop-color="#eef4f8"/>
  </linearGradient>
</defs>
  <g filter="url(#tbDrop)">
    <rect x="7" y="7" width="886" height="30" rx="4" fill="url(#tbBody)"/>
  </g>
  <rect x="13" y="7.5" width="874" height="0.9" fill="url(#tbLip)"/>
  <rect x="7.4" y="7.4" width="885.2" height="29.2" rx="4" fill="none"
        stroke="#5d8ba0" stroke-width="0.7" opacity="0.65"/>
  <g class="t">
    <text x="22" y="25.6" fill="#062430" font-size="9.5" letter-spacing="4.6">S / T A N I</text>
    <circle cx="176" cy="22" r="2.8" fill="#0e7490" filter="url(#tbGlow)">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="185" y="24.6" fill="#0e7490" font-size="7.2" letter-spacing="2.4">LIVE</text>
    <line x1="234" y1="12" x2="234" y2="32" stroke="#5d8ba0" stroke-width="0.45" opacity="0.6"/>
    <g clip-path="url(#tbTick)">
      <text y="24.6" fill="#5d8ba0" font-size="6.8" letter-spacing="2.4" xml:space="preserve">
        <animate attributeName="x" values="246;-899" dur="42s" repeatCount="indefinite"/>
        REPO shuccii/shuccii   •   BRANCH main   •   HEAD 6d41add   •   CONTRIB 160   •   COMMITS 157   •   PEAK 79/WK   •   LANG PYTHON   •   SYNC 2026-09-05 09:18Z   •   REPO shuccii/shuccii   •   BRANCH main   •   HEAD 6d41add   •   CONTRIB 160   •   COMMITS 157   •   PEAK 79/WK   •   LANG PYTHON   •   SYNC 2026-09-05 09:18Z   •   
      </text>
    </g>
    <rect x="246" y="8" width="544" height="28" fill="url(#tbFade)"/>
    <line x1="796" y1="12" x2="796" y2="32" stroke="#5d8ba0" stroke-width="0.45" opacity="0.6"/>
    <text x="876" y="25" fill="#1d4d61" font-size="8.1" letter-spacing="1.8" text-anchor="end">2023 &#8594; NOW</text>
  </g>
</svg>
