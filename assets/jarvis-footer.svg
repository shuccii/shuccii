<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" role="img" aria-label="J.A.R.V.I.S. standby">
<defs>
  <radialGradient id="fDeep" cx="50%" cy="18%" r="86%">
    <stop offset="0%"   stop-color="#0a2a37"/>
    <stop offset="46%"  stop-color="#04121d"/>
    <stop offset="100%" stop-color="#01050a"/>
  </radialGradient>
  <radialGradient id="fVig" cx="50%" cy="40%" r="72%">
    <stop offset="52%"  stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.7"/>
  </radialGradient>
  <radialGradient id="fCore" cx="50%" cy="40%" r="58%">
    <stop offset="0%"   stop-color="#ffffff"/>
    <stop offset="18%"  stop-color="#dffaff"/>
    <stop offset="46%"  stop-color="#5fd4f5" stop-opacity="0.85"/>
    <stop offset="78%"  stop-color="#0f7f9f" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#06303f" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="fMetal" x1="0" y1="0" x2="0.7" y2="1">
    <stop offset="0%"   stop-color="#0d3f52"/>
    <stop offset="38%"  stop-color="#2a7f9b"/>
    <stop offset="60%"  stop-color="#0a2f3e"/>
    <stop offset="100%" stop-color="#154b60"/>
  </linearGradient>
  <linearGradient id="fSweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#22d3ee" stop-opacity="0"/>
    <stop offset="50%"  stop-color="#9ff0ff" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="fBarFade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#7defff"/>
    <stop offset="100%" stop-color="#0e7490"/>
  </linearGradient>
  <filter id="fBloom" x="-90%" y="-90%" width="280%" height="280%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="1.6" result="a"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="6"   result="b"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="14"  result="c"/>
    <feMerge><feMergeNode in="c"/><feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="fBloomS" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="1.3" result="a"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="4.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="fSpec" x="-45%" y="-45%" width="190%" height="190%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="h"/>
    <feSpecularLighting in="h" surfaceScale="4.6" specularConstant="1.1" specularExponent="22"
                        lighting-color="#e4faff" result="s">
      <fePointLight x="-40" y="-40" z="46">
        <animate attributeName="x" values="-46;46;-46" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-40;40;-40" dur="9s" repeatCount="indefinite"/>
      </fePointLight>
    </feSpecularLighting>
    <feComposite in="s" in2="SourceAlpha" operator="in" result="sc"/>
    <feComposite in="SourceGraphic" in2="sc" operator="arithmetic" k1="0" k2="1" k3="0.95" k4="0"/>
  </filter>
  <filter id="fHolo" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="5" result="n">
      <animate attributeName="seed" values="5;12;19;5" dur="1.2s" calcMode="discrete" repeatCount="indefinite"/>
    </feTurbulence>
    <feColorMatrix in="n" type="matrix"
      values="0 0 0 0 0.13   0 0 0 0 0.72   0 0 0 0 0.85   0 0 0 0.3 0"/>
  </filter>
  <linearGradient id="fFloorFade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
  </linearGradient>
  <mask id="fFloorMask"><rect y="90" width="900" height="60" fill="url(#fFloorFade)"/></mask>
  <pattern id="fScan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1.2" fill="#0a3d4d" opacity="0.34"/>
  </pattern>
  <clipPath id="fClip"><rect width="900" height="150" rx="7"/></clipPath>
  <style>.fm{font-family:"SFMono-Regular","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;}</style>
</defs>

<g clip-path="url(#fClip)">
  <rect width="900" height="150" fill="url(#fDeep)"/>

  <!-- receding floor -->
  <g mask="url(#fFloorMask)" opacity="0.7">
    <g stroke="#17738f" stroke-width="1.1">
      <path d="M450 88 L-400 150"/><path d="M450 88 L-120 150"/><path d="M450 88 L110 150"/>
      <path d="M450 88 L290 150"/> <path d="M450 88 L610 150"/> <path d="M450 88 L790 150"/>
      <path d="M450 88 L1020 150"/><path d="M450 88 L1300 150"/>
    </g>
    <g stroke="#0e7490" stroke-width="1.1" fill="none">
      <path d="M0 106 H900"/><path d="M0 122 H900"/><path d="M0 144 H900"/>
    </g>
  </g>

  <!-- telemetry bars -->
  <g fill="url(#fBarFade)" opacity="0.9" filter="url(#fBloomS)">
    <rect x="64"  width="4"><animate attributeName="height" values="8;30;8"   dur="2.1s" repeatCount="indefinite"/><animate attributeName="y" values="76;54;76" dur="2.1s" repeatCount="indefinite"/></rect>
    <rect x="76"  width="4"><animate attributeName="height" values="24;6;24"  dur="2.7s" repeatCount="indefinite"/><animate attributeName="y" values="60;78;60" dur="2.7s" repeatCount="indefinite"/></rect>
    <rect x="88"  width="4"><animate attributeName="height" values="12;34;12" dur="1.7s" repeatCount="indefinite"/><animate attributeName="y" values="72;50;72" dur="1.7s" repeatCount="indefinite"/></rect>
    <rect x="100" width="4"><animate attributeName="height" values="30;10;30" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="54;74;54" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="112" width="4"><animate attributeName="height" values="9;26;9"   dur="3.1s" repeatCount="indefinite"/><animate attributeName="y" values="75;58;75" dur="3.1s" repeatCount="indefinite"/></rect>
  </g>
  <g fill="url(#fBarFade)" opacity="0.9" filter="url(#fBloomS)" transform="translate(724,0)">
    <rect x="64"  width="4"><animate attributeName="height" values="26;8;26"  dur="2.5s" repeatCount="indefinite"/><animate attributeName="y" values="58;76;58" dur="2.5s" repeatCount="indefinite"/></rect>
    <rect x="76"  width="4"><animate attributeName="height" values="10;32;10" dur="1.9s" repeatCount="indefinite"/><animate attributeName="y" values="74;52;74" dur="1.9s" repeatCount="indefinite"/></rect>
    <rect x="88"  width="4"><animate attributeName="height" values="28;12;28" dur="2.9s" repeatCount="indefinite"/><animate attributeName="y" values="56;72;56" dur="2.9s" repeatCount="indefinite"/></rect>
    <rect x="100" width="4"><animate attributeName="height" values="14;30;14" dur="2.2s" repeatCount="indefinite"/><animate attributeName="y" values="70;54;70" dur="2.2s" repeatCount="indefinite"/></rect>
    <rect x="112" width="4"><animate attributeName="height" values="32;9;32"  dur="3.3s" repeatCount="indefinite"/><animate attributeName="y" values="52;75;52" dur="3.3s" repeatCount="indefinite"/></rect>
  </g>

  <!-- mini reactor -->
  <g transform="translate(450,62)">
    <circle r="42" fill="#22d3ee" opacity="0.08" filter="url(#fBloom)"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite"/>
      <ellipse rx="38" ry="13" fill="none" stroke="#1d7f9c" stroke-width="1.4" opacity="0.85"/>
      <ellipse rx="38" ry="13" fill="none" stroke="#7defff" stroke-width="2" stroke-dasharray="6 230" filter="url(#fBloomS)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="21s" repeatCount="indefinite"/>
      <ellipse rx="34" ry="11" fill="none" stroke="#f5b841" stroke-width="1.6" stroke-dasharray="4 210" opacity="0.9" filter="url(#fBloomS)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="11s" repeatCount="indefinite"/>
      <circle r="27" fill="none" stroke="#0e7490" stroke-width="5" stroke-dasharray="1.4 7" opacity="0.9"/>
    </g>
    <circle r="18" fill="none" stroke="url(#fMetal)" stroke-width="6" filter="url(#fSpec)"/>
    <circle r="21.5" fill="none" stroke="#0a2a38" stroke-width="1.2" opacity="0.9"/>
    <circle r="12" fill="url(#fCore)" filter="url(#fBloom)">
      <animate attributeName="r" values="10;14;10" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle fill="none" stroke="#7defff" stroke-width="1.2" opacity="0">
      <animate attributeName="r" values="16;48" dur="4.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="4.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g class="fm" text-anchor="middle">
    <text x="450" y="122" fill="#6fbcd4" font-size="11.5" letter-spacing="3.4">SYSTEM STANDBY &#183; AWAITING NEXT DIRECTIVE</text>
  </g>
  <rect x="666" y="112" width="7" height="12" fill="#f5b841" filter="url(#fBloomS)">
    <animate attributeName="opacity" values="1;1;0.1;0.1" keyTimes="0;0.5;0.55;1" dur="1.7s" repeatCount="indefinite"/>
  </rect>

  <g stroke="#22d3ee" stroke-width="1.7" fill="none" opacity="0.85">
    <path d="M13 42 V137 H66"/><path d="M887 42 V137 H834"/>
  </g>
  <path d="M0 7 H900" stroke="#0e7490" stroke-width="1.3" opacity="0.85"/>
  <rect x="-220" y="5.2" width="220" height="3.6" fill="url(#fSweep)" filter="url(#fBloomS)">
    <animate attributeName="x" values="-220;900" dur="6s" repeatCount="indefinite"/>
  </rect>

  <rect width="900" height="150" fill="url(#fScan)" opacity="0.42"/>
  <rect width="900" height="150" filter="url(#fHolo)" opacity="0.45"/>
  <rect width="900" height="150" fill="url(#fVig)"/>
</g>
</svg>
