<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 58" width="900" height="58" role="img" aria-label="J.A.R.V.I.S. boot sequence">
  <defs>
    <linearGradient id="bsSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#67e8f9" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bsClip"><rect width="900" height="58" rx="5"/></clipPath>
    <style>
      .bsm { font-family: "SFMono-Regular","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace; font-size: 16px; }
    </style>
  </defs>

  <g clip-path="url(#bsClip)">
    <rect width="900" height="58" fill="#05090f"/>
    <rect x="0.75" y="0.75" width="898.5" height="56.5" rx="5" fill="none" stroke="#0e7490" stroke-width="1.5" opacity="0.7"/>

    <!-- prompt -->
    <text class="bsm" x="26" y="35" fill="#f5b841">jarvis&gt;</text>

    <!-- cycling readout: line 0 is fully drawn on the first frame -->
    <g class="bsm" fill="#22d3ee">
      <text x="106" y="35" opacity="1">J.A.R.V.I.S. online. Welcome back, sir.
        <animate attributeName="opacity" dur="14s" calcMode="discrete" keyTimes="0;0.25;0.5;0.75" values="1;0;0;0" repeatCount="indefinite"/>
      </text>
      <text x="106" y="35" opacity="0">Scanning structural materials for fusion reactors...
        <animate attributeName="opacity" dur="14s" calcMode="discrete" keyTimes="0;0.25;0.5;0.75" values="0;1;0;0" repeatCount="indefinite"/>
      </text>
      <text x="106" y="35" opacity="0">Assimilating experiment + first-principles data.
        <animate attributeName="opacity" dur="14s" calcMode="discrete" keyTimes="0;0.25;0.5;0.75" values="0;0;1;0" repeatCount="indefinite"/>
      </text>
      <text x="106" y="35" opacity="0">Bayesian optimization | next candidate located.
        <animate attributeName="opacity" dur="14s" calcMode="discrete" keyTimes="0;0.25;0.5;0.75" values="0;0;0;1" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- caret : parked after the longest line, blinking -->
    <rect x="489" y="22" width="9" height="17" fill="#f5b841" opacity="1">
      <animate attributeName="opacity" dur="1.1s" calcMode="discrete" keyTimes="0;0.5" values="1;0.12" repeatCount="indefinite"/>
      <animate attributeName="x" dur="14s" calcMode="discrete" keyTimes="0;0.25;0.5;0.75" values="489;615;577;567" repeatCount="indefinite"/>
    </rect>

    <!-- status pip -->
    <circle cx="866" cy="29" r="4.5" fill="#34d399" opacity="0.95">
      <animate attributeName="opacity" values="0.95;0.25;0.95" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text class="bsm" x="820" y="34" fill="#4b8ba3" font-size="11" letter-spacing="1.5">RUN</text>

    <rect x="-220" y="0" width="220" height="58" fill="url(#bsSweep)" opacity="0.14">
      <animate attributeName="x" values="-220;900" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
