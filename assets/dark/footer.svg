<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 128" width="900" height="128" role="img" aria-label="recent activity and account totals">
<defs>
  <radialGradient id="fDeep" cx="16%" cy="50%" r="88%">
    <stop offset="0%" stop-color="#123a4e" stop-opacity="0.5"/>
    <stop offset="46%" stop-color="#0b2534" stop-opacity="0.40"/>
    <stop offset="100%" stop-color="#05141e" stop-opacity="0.3"/>
  </radialGradient>
  <radialGradient id="fVig" cx="50%" cy="50%" r="74%">
    <stop offset="58%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
  </radialGradient>
  <radialGradient id="fCore" cx="50%" cy="42%" r="58%"><stop offset="0%" stop-color="#ffffff" stop-opacity="1"/><stop offset="26%" stop-color="#dff8ff" stop-opacity="1"/><stop offset="60%" stop-color="#54c8e8" stop-opacity="0.62"/><stop offset="100%" stop-color="#0a4b61" stop-opacity="0"/></radialGradient>
  <linearGradient id="fSweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#6fe0f7" stop-opacity="0"/>
    <stop offset="52%" stop-color="#6fe0f7" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#6fe0f7" stop-opacity="0"/>
  </linearGradient>
  <filter id="fBevel" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="hh"/>
    <feSpecularLighting in="hh" surfaceScale="3.6" specularConstant="0.85"
                        specularExponent="26" lighting-color="#dff6ff" result="s">
      <fePointLight x="-70" y="-70" z="60">
        <animate attributeName="x" values="-70;70;-70" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-70;70;-70" dur="13s" repeatCount="indefinite"/>
      </fePointLight>
    </feSpecularLighting>
    <feComposite in="s" in2="SourceAlpha" operator="in" result="sc"/>
    <feComposite in="SourceGraphic" in2="sc" operator="arithmetic" k1="0" k2="1" k3="0.90" k4="0"/>
  </filter>
  <filter id="fGlow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="0.90" result="a"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="3.60" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="fGrain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="5" result="n">
      <animate attributeName="seed" values="5;13;21;5" dur="1.3s" calcMode="discrete" repeatCount="indefinite"/>
    </feTurbulence>
    <feColorMatrix in="n" type="matrix"
      values="0 0 0 0 0.12  0 0 0 0 0.66  0 0 0 0 0.8  0 0 0 0.18 0"/>
  </filter>
  <pattern id="fScan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="0.8" fill="#0a3242" opacity="0.28"/>
  </pattern>
  <clipPath id="fClip"><rect width="900" height="128" rx="3"/></clipPath>
  <style>.t{font-family:"SFMono-Regular","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;}</style>
  <!-- Fresnel: transparent looking straight through, reflective at the edges -->
  <linearGradient id="fFace" x1="0.12" y1="0" x2="0.55" y2="1">
    <stop offset="0%"   stop-color="#123a4e" stop-opacity="0.5"/>
    <stop offset="46%"  stop-color="#0b2534"   stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#05141e" stop-opacity="0.40"/>
  </linearGradient>
  <linearGradient id="fEdgeV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#123a4e" stop-opacity="0.5"/>
    <stop offset="14%"  stop-color="#0b2534"   stop-opacity="0"/>
    <stop offset="86%"  stop-color="#05141e" stop-opacity="0"/>
    <stop offset="100%" stop-color="#05141e" stop-opacity="0.62"/>
  </linearGradient>

  <!-- dispersion: the hues travel along the edge, so the colour itself flows -->
  <linearGradient id="fIris" x1="0" y1="0" x2="1" y2="0.35"
                  gradientUnits="objectBoundingBox">
    <stop offset="0.00" stop-color="#7fe4fa"/>
    <stop offset="0.26" stop-color="#69f0d0"/>
    <stop offset="0.48" stop-color="#eaf6ff"/>
    <stop offset="0.71" stop-color="#b79cff"/>
    <stop offset="1.00" stop-color="#ffcf7a"/>
    <animate attributeName="x1" values="-1;0;1" dur="19s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;1;2" dur="19s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="fIrisSoft" x1="0" y1="0" x2="1" y2="0.6">
    <stop offset="0.00" stop-color="#69f0d0" stop-opacity="0.4"/>
    <stop offset="0.34" stop-color="#eaf6ff" stop-opacity="0.3"/>
    <stop offset="0.62" stop-color="#b79cff" stop-opacity="0.36"/>
    <stop offset="1.00" stop-color="#7fe4fa" stop-opacity="0.32"/>
    <animate attributeName="x1" values="-0.8;0.2;1.2" dur="26s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0.2;1.2;2.2" dur="26s" repeatCount="indefinite"/>
  </linearGradient>

  <!-- the polished top arris, and the ground bottom one -->
  <linearGradient id="fArris" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="8%"   stop-color="#ffffff" stop-opacity="0.7"/>
    <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="fSheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.42"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>

  <!-- a corner glint: light funnelled into the 90-degree arris -->
  <radialGradient id="fGlint" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.85"/>
    <stop offset="38%"  stop-color="#eaf6ff" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#eaf6ff" stop-opacity="0"/>
  </radialGradient>

  <filter id="fCast" x="-14%" y="-14%" width="128%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="6"
                  flood-color="#00070f"
                  flood-opacity="0.7"/>
  </filter>
  <filter id="fCaustic" x="-40%" y="-60%" width="180%" height="260%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <clipPath id="fShape"><path d="M10.00 7.00H890.00A3.00 3.00 0 0 1 893.00 10.00V118.00A3.00 3.00 0 0 1 890.00 121.00H10.00A3.00 3.00 0 0 1 7.00 118.00V10.00A3.00 3.00 0 0 1 10.00 7.00Z"/></clipPath></defs>

  <path d="M10.00 7.00H890.00A3.00 3.00 0 0 1 893.00 10.00V118.00A3.00 3.00 0 0 1 890.00 121.00H10.00A3.00 3.00 0 0 1 7.00 118.00V10.00A3.00 3.00 0 0 1 10.00 7.00Z" fill="#05141e" opacity="0.55" filter="url(#fCast)"/>
  <rect x="148.8" y="123.0" width="602.5" height="7"
        fill="url(#fIrisSoft)" opacity="0.3" filter="url(#fCaustic)"/>

  <path d="M10.00 7.00H890.00A3.00 3.00 0 0 1 893.00 10.00V118.00A3.00 3.00 0 0 1 890.00 121.00H10.00A3.00 3.00 0 0 1 7.00 118.00V10.00A3.00 3.00 0 0 1 10.00 7.00Z" fill="url(#fFace)"/>
  <path d="M10.00 7.00H890.00A3.00 3.00 0 0 1 893.00 10.00V118.00A3.00 3.00 0 0 1 890.00 121.00H10.00A3.00 3.00 0 0 1 7.00 118.00V10.00A3.00 3.00 0 0 1 10.00 7.00Z" fill="url(#fEdgeV)"/>

  <!-- edge band: dispersion strongest where the sheet is seen at a grazing angle -->
  <g clip-path="url(#fShape)">
    <path d="M10.00 7.00H890.00A3.00 3.00 0 0 1 893.00 10.00V118.00A3.00 3.00 0 0 1 890.00 121.00H10.00A3.00 3.00 0 0 1 7.00 118.00V10.00A3.00 3.00 0 0 1 10.00 7.00Z" fill="none"
          stroke="url(#fIrisSoft)" stroke-width="18"
          opacity="0.17"/>
    <rect x="-436.0" y="7" width="443.0" height="114"
          fill="url(#fSheen)" opacity="0.1" transform="skewX(-12)">
      <animate attributeName="x" values="-480.3;981.6" dur="17s" repeatCount="indefinite"/>
    </rect>
    <ellipse cx="10.0" cy="10.0" rx="10" ry="10" fill="url(#fGlint)" opacity="0.7"/><ellipse cx="890.0" cy="10.0" rx="10" ry="10" fill="url(#fGlint)" opacity="0.4"/><ellipse cx="10.0" cy="118.0" rx="10" ry="10" fill="url(#fGlint)" opacity="0.28"/><ellipse cx="890.0" cy="118.0" rx="10" ry="10" fill="url(#fGlint)" opacity="0.45"/>
  </g>

  <!-- polished arris along the top, ground edge along the bottom -->
  <path d="M10.0 7.5H890.0" stroke="url(#fArris)" stroke-width="1"/>
  <path d="M10.0 120.5H890.0" stroke="#05141e" stroke-width="1"
        opacity="0.75"/>
  <path d="M10.00 7.00H890.00A3.00 3.00 0 0 1 893.00 10.00V118.00A3.00 3.00 0 0 1 890.00 121.00H10.00A3.00 3.00 0 0 1 7.00 118.00V10.00A3.00 3.00 0 0 1 10.00 7.00Z" fill="none" stroke="url(#fIris)" stroke-width="0.9"
        opacity="0.5"/>
<g clip-path="url(#fShape)">

  <g class="t">
    <text x="66" y="24" fill="#63a8c0" font-size="7.8" letter-spacing="2.4">LAST 26 WEEKS</text>
    <line x1="66" y1="78" x2="486" y2="78" stroke="#63a8c0" stroke-width="0.45" opacity="0.7"/>
    <g><line x1="66.0" y1="78" x2="66.0" y2="78.0" stroke="#25596f" stroke-width="1.6" opacity="0.75"/>
      <line x1="82.8" y1="78" x2="82.8" y2="78.0" stroke="#25596f" stroke-width="1.6" opacity="0.75"/>
      <line x1="99.6" y1="78" x2="99.6" y2="78.0" stroke="#25596f" stroke-width="1.6" opacity="0.75"/>
      <line x1="116.4" y1="78" x2="116.4" y2="78.0" stroke="#25596f" stroke-width="1.6" opacity="0.75"/>
      <line x1="133.2" y1="78" x2="133.2" y2="78.0" stroke="#25596f" stroke-width="1.6" opacity="0.75"/>
      <line x1="150.0" y1="78" x2="150.0" y2="78.0" stroke="#25596f" stroke-width="1.6" opacity="0.75"/>
      <line x1="166.8" y1="78" x2="166.8" y2="78.0" stroke="#25596f" stroke-width="1.6" opacity="0.75"/>
      <line x1="183.6" y1="78" x2="183.6" y2="78.0" stroke="#25596f" stroke-width="1.6" opacity="0.75"/>
      <line x1="200.4" y1="78" x2="200.4" y2="78.0" stroke="#25596f" stroke-width="1.6" opacity="0.75"/>
      <line x1="217.2" y1="78" x2="217.2" y2="78.0" stroke="#25596f" stroke-width="1.6" opacity="0.75"/>
      <line x1="234.0" y1="78" x2="234.0" y2="78.0" stroke="#25596f" stroke-width="1.6" opacity="0.75"/>
      <line x1="250.8" y1="78" x2="250.8" y2="78.0" stroke="#25596f" stroke-width="1.6" opacity="0.75"/>
      <line x1="267.6" y1="78" x2="267.6" y2="78.0" stroke="#25596f" stroke-width="1.6" opacity="0.75"/>
      <line x1="284.4" y1="78" x2="284.4" y2="78.0" stroke="#25596f" stroke-width="1.6" opacity="0.75"/>
      <line x1="301.2" y1="78" x2="301.2" y2="74.2" stroke="#1a7592" stroke-width="1.6" opacity="0.75"/>
      <line x1="318.0" y1="78" x2="318.0" y2="71.6" stroke="#1a7592" stroke-width="1.6" opacity="0.75"/>
      <line x1="334.8" y1="78" x2="334.8" y2="76.3" stroke="#1a7592" stroke-width="1.6" opacity="0.75"/>
      <line x1="351.6" y1="78" x2="351.6" y2="34.0" stroke="#b4f3ff" stroke-width="1.6" opacity="0.75"/>
      <line x1="368.4" y1="78" x2="368.4" y2="58.9" stroke="#28abcc" stroke-width="1.6" opacity="0.75"/>
      <line x1="385.2" y1="78" x2="385.2" y2="64.1" stroke="#1a7592" stroke-width="1.6" opacity="0.75"/>
      <line x1="402.0" y1="78" x2="402.0" y2="68.7" stroke="#1a7592" stroke-width="1.6" opacity="0.75"/>
      <line x1="418.8" y1="78" x2="418.8" y2="73.3" stroke="#1a7592" stroke-width="1.6" opacity="0.75"/>
      <line x1="435.6" y1="78" x2="435.6" y2="73.3" stroke="#1a7592" stroke-width="1.6" opacity="0.75"/>
      <line x1="452.4" y1="78" x2="452.4" y2="71.6" stroke="#1a7592" stroke-width="1.6" opacity="0.75"/>
      <line x1="469.2" y1="78" x2="469.2" y2="73.3" stroke="#1a7592" stroke-width="1.6" opacity="0.75"/>
      <line x1="486.0" y1="78" x2="486.0" y2="78.0" stroke="#25596f" stroke-width="1.6" opacity="0.75"/></g>
    <polyline points="66.0,78.0 82.8,78.0 99.6,78.0 116.4,78.0 133.2,78.0 150.0,78.0 166.8,78.0 183.6,78.0 200.4,78.0 217.2,78.0 234.0,78.0 250.8,78.0 267.6,78.0 284.4,78.0 301.2,74.2 318.0,71.6 334.8,76.3 351.6,34.0 368.4,58.9 385.2,64.1 402.0,68.7 418.8,73.3 435.6,73.3 452.4,71.6 469.2,73.3 486.0,78.0" fill="none" stroke="#6fe0f7" stroke-width="0.7" opacity="0.9"/>
    <line x1="66" y1="28" x2="66" y2="78" stroke="#63a8c0" stroke-width="0.45" opacity="0.5"/>
    <text x="60" y="33" fill="#63a8c0" font-size="6.4" text-anchor="end">79</text>
    <text x="60" y="81" fill="#63a8c0" font-size="6.4" text-anchor="end">0</text>
    <line x1="524" y1="24" x2="524" y2="94" stroke="#63a8c0" stroke-width="0.45" opacity="0.55"/>
    <text x="560.0" y="52" fill="#63a8c0" font-size="7.8" letter-spacing="2.2">REPOS</text>
    <text x="560.0" y="74" fill="#dcf3fd" font-size="17" letter-spacing="0.4">3</text>
    <line x1="643.3" y1="41" x2="643.3" y2="79" stroke="#63a8c0" stroke-width="0.45" opacity="0.55"/>
    <text x="657.3" y="52" fill="#63a8c0" font-size="7.8" letter-spacing="2.2">STARS</text>
    <text x="657.3" y="74" fill="#dcf3fd" font-size="17" letter-spacing="0.4">0</text>
    <line x1="740.7" y1="41" x2="740.7" y2="79" stroke="#63a8c0" stroke-width="0.45" opacity="0.55"/>
    <text x="754.7" y="52" fill="#63a8c0" font-size="7.8" letter-spacing="2.2">FOLLOW</text>
    <text x="754.7" y="74" fill="#dcf3fd" font-size="17" letter-spacing="0.4">2</text>
    <line x1="66" y1="98" x2="834" y2="98" stroke="#63a8c0" stroke-width="0.45" opacity="0.45"/>
    <text x="66" y="115" fill="#63a8c0" font-size="8.3" letter-spacing="1.7">shuccii/shuccii &#183; regenerated daily by github actions</text>
    <text x="834" y="115" fill="#63a8c0" font-size="8.3" letter-spacing="1.7" text-anchor="end">SYNC 2026-09-07 08:29Z</text>
  </g>

  <rect x="-300" y="0" width="300" height="128" fill="url(#fSweep)" opacity="0.09">
    <animate attributeName="x" values="-300;900" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect width="900" height="128" fill="url(#fScan)" opacity="0.34"/>
  <rect width="900" height="128" filter="url(#fGrain)" opacity="0.32"/>
  <rect width="900" height="128" fill="url(#fVig)"/>
</g>
</svg>
