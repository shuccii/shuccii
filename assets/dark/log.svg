    </g>
  </g>
  <rect x="7" y="28" width="886" height="151" fill="url(#lgScan)" opacity="0.2"/>
  <rect x="7" y="28" width="886" height="151" filter="url(#lgGrain)" opacity="0.16"/>
</g>
