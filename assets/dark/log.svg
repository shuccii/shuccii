<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 186" width="900" height="186" role="img" aria-label="recent commits">
<defs>
  <radialGradient id="lgDeep" cx="16%" cy="50%" r="88%">
    <stop offset="0%" stop-color="#123a4e" stop-opacity="0.5"/>
    <stop offset="46%" stop-color="#0b2534" stop-opacity="0.40"/>
    <stop offset="100%" stop-color="#05141e" stop-opacity="0.3"/>
  </radialGradient>
  <radialGradient id="lgVig" cx="50%" cy="50%" r="74%">
    <stop offset="58%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
  </radialGradient>
  <radialGradient id="lgCore" cx="50%" cy="42%" r="58%"><stop offset="0%" stop-color="#ffffff" stop-opacity="1"/><stop offset="26%" stop-color="#dff8ff" stop-opacity="1"/><stop offset="60%" stop-color="#54c8e8" stop-opacity="0.62"/><stop offset="100%" stop-color="#0a4b61" stop-opacity="0"/></radialGradient>
  <linearGradient id="lgSweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#6fe0f7" stop-opacity="0"/>
    <stop offset="52%" stop-color="#6fe0f7" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#6fe0f7" stop-opacity="0"/>
  </linearGradient>
  <filter id="lgBevel" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="hh"/>
    <feSpecularLighting in="hh" surfaceScale="3.6" specularConstant="0.85"
                        specularExponent="26" lighting-color="#dff6ff" result="s">
      <fePointLight x="-70" y="-70" z="60">
        <animate attributeName="x" values="-70;70;-70" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-70;70;-70" dur="13s" repeatCount="indefinite"/>
      </fePointLight>
    </feSpecularLighting>
    <feComposite in="s" in2="SourceAlpha" operator="in" result="sc"/>
    <feComposite in="SourceGraphic" in2="sc" operator="arithmetic" k1="0" k2="1" k3="0.90" k4="0"/>
  </filter>
  <filter id="lgGlow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="0.90" result="a"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="3.60" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="lgGrain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="5" result="n">
      <animate attributeName="seed" values="5;13;21;5" dur="1.3s" calcMode="discrete" repeatCount="indefinite"/>
    </feTurbulence>
    <feColorMatrix in="n" type="matrix"
      values="0 0 0 0 0.12  0 0 0 0 0.66  0 0 0 0 0.8  0 0 0 0.18 0"/>
  </filter>
  <pattern id="lgScan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="0.8" fill="#0a3242" opacity="0.28"/>
  </pattern>
  <clipPath id="lgClip"><rect width="900" height="186" rx="3"/></clipPath>
  <style>.t{font-family:"SFMono-Regular","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;}</style>
  <!-- Fresnel: transparent looking straight through, reflective at the edges -->
  <linearGradient id="lgFace" x1="0.12" y1="0" x2="0.55" y2="1">
    <stop offset="0%"   stop-color="#123a4e" stop-opacity="0.5"/>
    <stop offset="46%"  stop-color="#0b2534"   stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#05141e" stop-opacity="0.40"/>
  </linearGradient>
  <linearGradient id="lgEdgeV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#123a4e" stop-opacity="0.5"/>
    <stop offset="14%"  stop-color="#0b2534"   stop-opacity="0"/>
    <stop offset="86%"  stop-color="#05141e" stop-opacity="0"/>
    <stop offset="100%" stop-color="#05141e" stop-opacity="0.62"/>
  </linearGradient>

  <!-- dispersion: the hues travel along the edge, so the colour itself flows -->
  <linearGradient id="lgIris" x1="0" y1="0" x2="1" y2="0.35"
                  gradientUnits="objectBoundingBox">
    <stop offset="0.00" stop-color="#7fe4fa"/>
    <stop offset="0.26" stop-color="#69f0d0"/>
    <stop offset="0.48" stop-color="#eaf6ff"/>
    <stop offset="0.71" stop-color="#b79cff"/>
    <stop offset="1.00" stop-color="#ffcf7a"/>
    <animate attributeName="x1" values="-1;0;1" dur="19s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;1;2" dur="19s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="lgIrisSoft" x1="0" y1="0" x2="1" y2="0.6">
    <stop offset="0.00" stop-color="#69f0d0" stop-opacity="0.4"/>
    <stop offset="0.34" stop-color="#eaf6ff" stop-opacity="0.3"/>
    <stop offset="0.62" stop-color="#b79cff" stop-opacity="0.36"/>
    <stop offset="1.00" stop-color="#7fe4fa" stop-opacity="0.32"/>
    <animate attributeName="x1" values="-0.8;0.2;1.2" dur="26s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0.2;1.2;2.2" dur="26s" repeatCount="indefinite"/>
  </linearGradient>

  <!-- the polished top arris, and the ground bottom one -->
  <linearGradient id="lgArris" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="8%"   stop-color="#ffffff" stop-opacity="0.7"/>
    <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="lgSheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.42"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>

  <!-- a corner glint: light funnelled into the 90-degree arris -->
  <radialGradient id="lgGlint" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.85"/>
    <stop offset="38%"  stop-color="#eaf6ff" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#eaf6ff" stop-opacity="0"/>
  </radialGradient>

  <filter id="lgCast" x="-14%" y="-14%" width="128%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="6"
                  flood-color="#00070f"
                  flood-opacity="0.7"/>
  </filter>
  <filter id="lgCaustic" x="-40%" y="-60%" width="180%" height="260%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <clipPath id="lgShape"><path d="M7.00 7.00H893.00V179.00H7.00Z"/></clipPath>
  <clipPath id="lgInner"><path d="M7.00 28.00H893.00V179.00H7.00Z"/></clipPath>
</defs>


  <path d="M7.00 7.00H893.00V179.00H7.00Z" fill="#05141e" opacity="0.55" filter="url(#lgCast)"/>
  <rect x="148.8" y="181.0" width="602.5" height="7"
        fill="url(#lgIrisSoft)" opacity="0.3" filter="url(#lgCaustic)"/>

  <path d="M7.00 7.00H893.00V179.00H7.00Z" fill="url(#lgFace)"/>
  <path d="M7.00 7.00H893.00V179.00H7.00Z" fill="url(#lgEdgeV)"/>

  <!-- edge band: dispersion strongest where the sheet is seen at a grazing angle -->
  <g clip-path="url(#lgShape)">
    <rect x="7" y="7" width="886" height="172" fill="none"
          stroke="url(#lgIrisSoft)" stroke-width="18"
          opacity="0.17"/>
    <rect x="-436.0" y="7" width="443.0" height="172"
          fill="url(#lgSheen)" opacity="0.1" transform="skewX(-12)">
      <animate attributeName="x" values="-480.3;981.6" dur="17s" repeatCount="indefinite"/>
    </rect>
    <ellipse cx="7" cy="7" rx="10" ry="10" fill="url(#lgGlint)" opacity="0.7"/><ellipse cx="893" cy="7" rx="10" ry="10" fill="url(#lgGlint)" opacity="0.4"/><ellipse cx="7" cy="179" rx="10" ry="10" fill="url(#lgGlint)" opacity="0.28"/><ellipse cx="893" cy="179" rx="10" ry="10" fill="url(#lgGlint)" opacity="0.45"/>
  </g>

  <!-- polished arris along the top, ground edge along the bottom -->
  <path d="M7.5 7.5H892.5" stroke="url(#lgArris)" stroke-width="1"/>
  <path d="M7.5 178.5H892.5" stroke="#05141e" stroke-width="1"
        opacity="0.75"/>
  <path d="M7.00 7.00H893.00V179.00H7.00Z" fill="none" stroke="url(#lgIris)" stroke-width="0.9"
        opacity="0.5"/>
  <path d="M17 28 H883"
        stroke="url(#lgIrisSoft)" stroke-width="0.6" opacity="0.75"/>
  <g class="t">
    <circle cx="22" cy="19" r="2.6" fill="none" stroke="#6fe0f7" stroke-width="0.45"/>
    <circle cx="22" cy="19" r="0.9" fill="#6fe0f7"/>
    <text x="31" y="22" fill="#6fe0f7" font-size="7.4" letter-spacing="2.8">COMMIT STREAM</text>
    <text x="879" y="22" fill="#63a8c0" font-size="6.8" letter-spacing="1.8"
          text-anchor="end">9 RECENT</text>
  </g>
<g clip-path="url(#lgInner)">

  <g class="t">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -153"
                        dur="23s" calcMode="linear" repeatCount="indefinite"/>
