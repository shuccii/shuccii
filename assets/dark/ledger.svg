<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 444 178" width="444" height="178" role="img" aria-label="activity ledger">
<defs>
  <radialGradient id="ldDeep" cx="16%" cy="50%" r="88%">
    <stop offset="0%" stop-color="#07202b" stop-opacity="0.62"/>
    <stop offset="46%" stop-color="#040f18" stop-opacity="0.48"/>
    <stop offset="100%" stop-color="#01050a" stop-opacity="0.34"/>
  </radialGradient>
  <radialGradient id="ldVig" cx="50%" cy="50%" r="74%">
    <stop offset="58%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
  </radialGradient>
  <radialGradient id="ldCore" cx="50%" cy="42%" r="58%"><stop offset="0%" stop-color="#ffffff" stop-opacity="1"/><stop offset="26%" stop-color="#dff8ff" stop-opacity="1"/><stop offset="60%" stop-color="#54c8e8" stop-opacity="0.62"/><stop offset="100%" stop-color="#0a4b61" stop-opacity="0"/></radialGradient>
  <linearGradient id="ldSweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#5fd8f2" stop-opacity="0"/>
    <stop offset="52%" stop-color="#5fd8f2" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#5fd8f2" stop-opacity="0"/>
  </linearGradient>
  <filter id="ldBevel" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="hh"/>
    <feSpecularLighting in="hh" surfaceScale="3.6" specularConstant="0.85"
                        specularExponent="26" lighting-color="#dff6ff" result="s">
      <fePointLight x="-70" y="-70" z="60">
        <animate attributeName="x" values="-70;70;-70" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-70;70;-70" dur="13s" repeatCount="indefinite"/>
      </fePointLight>
    </feSpecularLighting>
    <feComposite in="s" in2="SourceAlpha" operator="in" result="sc"/>
    <feComposite in="SourceGraphic" in2="sc" operator="arithmetic" k1="0" k2="1" k3="0.90" k4="0"/>
  </filter>
  <filter id="ldGlow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="0.90" result="a"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="3.60" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="ldGrain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="5" result="n">
      <animate attributeName="seed" values="5;13;21;5" dur="1.3s" calcMode="discrete" repeatCount="indefinite"/>
    </feTurbulence>
    <feColorMatrix in="n" type="matrix"
      values="0 0 0 0 0.12  0 0 0 0 0.66  0 0 0 0 0.8  0 0 0 0.18 0"/>
  </filter>
  <pattern id="ldScan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="0.8" fill="#0a3242" opacity="0.28"/>
  </pattern>
  <clipPath id="ldClip"><rect width="444" height="178" rx="3"/></clipPath>
  <style>.t{font-family:"SFMono-Regular","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;}</style>
  <linearGradient id="ldBody" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0%" stop-color="#07202b" stop-opacity="0.62"/>
    <stop offset="52%" stop-color="#040f18" stop-opacity="0.48"/>
    <stop offset="100%" stop-color="#01050a" stop-opacity="0.34"/>
  </linearGradient>
  <linearGradient id="ldBar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#5fd8f2" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="#5fd8f2" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ldLip" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="18%" stop-color="#ffffff" stop-opacity="0.42"/>
    <stop offset="82%" stop-color="#ffffff" stop-opacity="0.42"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <filter id="ldDrop" x="-12%" y="-12%" width="124%" height="130%">
    <feDropShadow dx="0" dy="2.4" stdDeviation="3.4"
                  flood-color="#000000"
                  flood-opacity="0.65"/>
  </filter>
  <clipPath id="ldInner"><rect x="7" y="28" width="430" height="143"/></clipPath>
</defs>

  <g filter="url(#ldDrop)">
    <rect x="7" y="7" width="430" height="164" rx="4" fill="url(#ldBody)"/>
  </g>
  <rect x="7" y="7" width="430" height="21" rx="4" fill="url(#ldBar)"/>
  <rect x="7" y="28" width="430" height="0.6" fill="#3f7f96" opacity="0.5"/>
  <rect x="13" y="7.5" width="418" height="0.9" fill="url(#ldLip)"/>
  <rect x="7.3" y="7.3" width="429.4" height="163.4" rx="4" fill="none"
        stroke="#5fd8f2" stroke-width="0.5" opacity="0.55"/>
  <path d="M10 16 V10 H16" stroke="#5fd8f2" stroke-width="0.45" fill="none" opacity="0.7"/><path d="M428 10 H434 V16" stroke="#5fd8f2" stroke-width="0.45" fill="none" opacity="0.7"/><path d="M10 162 V168 H16" stroke="#5fd8f2" stroke-width="0.45" fill="none" opacity="0.7"/><path d="M428 168 H434 V162" stroke="#5fd8f2" stroke-width="0.45" fill="none" opacity="0.7"/>
  <g class="t">
    <circle cx="20" cy="17.6" r="2.6" fill="none" stroke="#5fd8f2" stroke-width="0.45"/>
    <circle cx="20" cy="17.6" r="0.9" fill="#5fd8f2"/>
    <text x="29" y="20.6" fill="#5fd8f2" font-size="7.4" letter-spacing="2.8">LEDGER</text>
    <text x="429" y="20.6" fill="#3f7f96" font-size="6.8" letter-spacing="1.8"
          text-anchor="end">LAST 12 MONTHS</text>
  </g>
<g clip-path="url(#ldInner)">

  <g class="t">
    <text x="25" y="50" fill="#3f7f96" font-size="7.4" letter-spacing="1.6">TOTAL COMMITS</text><line x1="197" y1="47" x2="388" y2="47" stroke="#12384a" stroke-width="2" opacity="0.7"/><line x1="197" y1="47" x2="388.0" y2="47" stroke="#5fd8f2" stroke-width="2" opacity="0.9"/><text x="419" y="50" fill="#cfeefb" font-size="10.5" text-anchor="end">157</text><text x="25" y="74" fill="#3f7f96" font-size="7.4" letter-spacing="1.6">PULL REQUESTS</text><line x1="197" y1="71" x2="388" y2="71" stroke="#12384a" stroke-width="2" opacity="0.7"/><line x1="197" y1="71" x2="198.5" y2="71" stroke="#5fd8f2" stroke-width="2" opacity="0.9"/><text x="419" y="74" fill="#cfeefb" font-size="10.5" text-anchor="end">0</text><text x="25" y="98" fill="#3f7f96" font-size="7.4" letter-spacing="1.6">ISSUES</text><line x1="197" y1="95" x2="388" y2="95" stroke="#12384a" stroke-width="2" opacity="0.7"/><line x1="197" y1="95" x2="198.5" y2="95" stroke="#5fd8f2" stroke-width="2" opacity="0.9"/><text x="419" y="98" fill="#cfeefb" font-size="10.5" text-anchor="end">0</text><text x="25" y="122" fill="#3f7f96" font-size="7.4" letter-spacing="1.6">STARS EARNED</text><line x1="197" y1="119" x2="388" y2="119" stroke="#12384a" stroke-width="2" opacity="0.7"/><line x1="197" y1="119" x2="198.5" y2="119" stroke="#5fd8f2" stroke-width="2" opacity="0.9"/><text x="419" y="122" fill="#cfeefb" font-size="10.5" text-anchor="end">0</text><text x="25" y="146" fill="#3f7f96" font-size="7.4" letter-spacing="1.6">REPOS TOUCHED</text><line x1="197" y1="143" x2="388" y2="143" stroke="#12384a" stroke-width="2" opacity="0.7"/><line x1="197" y1="143" x2="200.6" y2="143" stroke="#5fd8f2" stroke-width="2" opacity="0.9"/><text x="419" y="146" fill="#cfeefb" font-size="10.5" text-anchor="end">3</text>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 24;0 48;0 72;0 96"
                        keyTimes="0.0000;0.2000;0.4000;0.6000;0.8000" dur="8.0s" calcMode="discrete" repeatCount="indefinite"/>
      <path d="M18 41 L22 44 L18 47 Z" fill="#e8b455"/>
      <line x1="18" y1="38" x2="18" y2="50" stroke="#e8b455" stroke-width="0.45" opacity="0.8"/>
      <line x1="427" y1="38" x2="427" y2="50" stroke="#e8b455" stroke-width="0.45" opacity="0.8"/>
    </g>
    <text x="25" y="162" fill="#3f7f96" font-size="5.8" letter-spacing="1.6">BARS SCALED TO THE LARGEST FIGURE</text>
  </g>
  <rect x="7" y="28" width="430" height="143" fill="url(#ldScan)" opacity="0.3"/>
  <rect x="7" y="28" width="430" height="143" filter="url(#ldGrain)" opacity="0.26"/>
</g>
</svg>
