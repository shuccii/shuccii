<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 178" width="900" height="178" role="img" aria-label="account summary">
<defs>
  <radialGradient id="smDeep" cx="16%" cy="50%" r="88%">
    <stop offset="0%" stop-color="#07202b" stop-opacity="0.62"/>
    <stop offset="46%" stop-color="#040f18" stop-opacity="0.48"/>
    <stop offset="100%" stop-color="#01050a" stop-opacity="0.34"/>
