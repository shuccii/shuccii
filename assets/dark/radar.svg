  <clipPath id="rdInner"><path d="M24.04 28.00L267.96 28.00C277.56 28.00 285.00 35.44 285.00 45.04L285.00 171.96C285.00 181.56 277.56 189.00 267.96 189.00L24.04 189.00C14.44 189.00 7.00 181.56 7.00 171.96L7.00 45.04C7.00 35.44 14.44 28.00 24.04 28.00Z"/></clipPath>
