ray="0.32 288.71" stroke-dashoffset="-288.62" transform="rotate(-90 99 98.5)" opacity="0.24"/><circle cx="99" cy="98.5" r="40.9" fill="none" stroke="#259d3d" stroke-width="3.3" stroke-dasharray="0.32 288.71" stroke-dashoffset="-288.62" transform="rotate(-90 99 98.5)" opacity="0.45"/>
