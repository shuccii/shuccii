    <linearGradient id="lnS0" gradientUnits="userSpaceOnUse" x1="97.4" y1="127.5" x2="127.4" y2="157.5"><stop offset="0%" stop-color="#a8ddeb"/><stop offset="48%" stop-color="#5abfd8"/><stop offset="100%" stop-color="#25859d"/></linearGradient><linearGradient id="lnS1" gradientUnits="userSpaceOnUse" x1="66.1" y1="41.1" x2="96.1" y2="71.1"><stop offset="0%" stop-color="#b6a8eb"/><stop offset="48%" stop-color="#735ad8"/><stop offset="100%" stop-color="#3d259d"/></linearGradient><linearGradient id="lnS2" gradientUnits="userSpaceOnUse" x1="76.5" y1="38.1" x2="106.5" y2="68.1"><stop offset="0%" stop-color="#eba8dd"/><stop offset="48%" stop-color="#d85abf"/><stop offset="100%" stop-color="#9d2585"/></linearGradient><linearGradient id="lnS3" gradientUnits="userSpaceOnUse" x1="79.8" y1="37.7" x2="109.8" y2="67.7"><stop offset="0%" stop-color="#ebb6a8"/><stop offset="48%" stop-color="#d8735a"/><stop offset="100%" stop-color="#9d3d25"/></linearGradient><linearGradient id="lnS4" gradientUnits="userSpaceOnUse" x1="82.4" y1="37.5" x2="112.4" y2="67.5"><stop offset="0%" stop-color="#ddeba8"/><stop offset="48%" stop-color="#bfd85a"/><stop offset="100%" stop-color="#859d25"/></linearGradient><linearGradient id="lnS5" gradientUnits="userSpaceOnUse" x1="83.8" y1="37.5" x2="113.8" y2="67.5"><stop offset="0%" stop-color="#a8ebb6"/><stop offset="48%" stop-color="#5ad873"/><stop offset="100%" stop-color="#259d3d"/></linearGradient>
