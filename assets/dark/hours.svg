<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 444 178" width="444" height="178" role="img" aria-label="commits by hour">
<defs>
  <radialGradient id="hrDeep" cx="16%" cy="50%" r="88%">
    <stop offset="0%" stop-color="#123a4e" stop-opacity="0.5"/>
    <stop offset="46%" stop-color="#0b2534" stop-opacity="0.40"/>
    <stop offset="100%" stop-color="#05141e" stop-opacity="0.3"/>
  </radialGradient>
  <radialGradient id="hrVig" cx="50%" cy="50%" r="74%">
    <stop offset="58%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
  </radialGradient>
  <radialGradient id="hrCore" cx="50%" cy="42%" r="58%"><stop offset="0%" stop-color="#ffffff" stop-opacity="1"/><stop offset="26%" stop-color="#dff8ff" stop-opacity="1"/><stop offset="60%" stop-color="#54c8e8" stop-opacity="0.62"/><stop offset="100%" stop-color="#0a4b61" stop-opacity="0"/></radialGradient>
  <linearGradient id="hrSweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#6fe0f7" stop-opacity="0"/>
    <stop offset="52%" stop-color="#6fe0f7" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#6fe0f7" stop-opacity="0"/>
  </linearGradient>
  <filter id="hrBevel" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="hh"/>
    <feSpecularLighting in="hh" surfaceScale="3.6" specularConstant="0.85"
                        specularExponent="26" lighting-color="#dff6ff" result="s">
      <fePointLight x="-70" y="-70" z="60">
        <animate attributeName="x" values="-70;70;-70" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-70;70;-70" dur="13s" repeatCount="indefinite"/>
      </fePointLight>
    </feSpecularLighting>
    <feComposite in="s" in2="SourceAlpha" operator="in" result="sc"/>
    <feComposite in="SourceGraphic" in2="sc" operator="arithmetic" k1="0" k2="1" k3="0.90" k4="0"/>
  </filter>
  <filter id="hrGlow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="0.90" result="a"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="3.60" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="hrGrain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="5" result="n">
      <animate attributeName="seed" values="5;13;21;5" dur="1.3s" calcMode="discrete" repeatCount="indefinite"/>
    </feTurbulence>
    <feColorMatrix in="n" type="matrix"
      values="0 0 0 0 0.12  0 0 0 0 0.66  0 0 0 0 0.8  0 0 0 0.18 0"/>
  </filter>
  <pattern id="hrScan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="0.8" fill="#0a3242" opacity="0.28"/>
  </pattern>
  <clipPath id="hrClip"><rect width="444" height="178" rx="3"/></clipPath>
  <style>.t{font-family:"SFMono-Regular","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;}</style>
  <!-- Fresnel: transparent looking straight through, reflective at the edges -->
  <linearGradient id="hrFace" x1="0.12" y1="0" x2="0.55" y2="1">
    <stop offset="0%"   stop-color="#123a4e" stop-opacity="0.5"/>
    <stop offset="46%"  stop-color="#0b2534"   stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#05141e" stop-opacity="0.40"/>
  </linearGradient>
  <linearGradient id="hrEdgeV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#123a4e" stop-opacity="0.5"/>
    <stop offset="14%"  stop-color="#0b2534"   stop-opacity="0"/>
    <stop offset="86%"  stop-color="#05141e" stop-opacity="0"/>
    <stop offset="100%" stop-color="#05141e" stop-opacity="0.62"/>
  </linearGradient>

  <!-- dispersion: the hues travel along the edge, so the colour itself flows -->
  <linearGradient id="hrIris" x1="0" y1="0" x2="1" y2="0.35"
                  gradientUnits="objectBoundingBox">
    <stop offset="0.00" stop-color="#7fe4fa"/>
    <stop offset="0.26" stop-color="#69f0d0"/>
    <stop offset="0.48" stop-color="#eaf6ff"/>
    <stop offset="0.71" stop-color="#b79cff"/>
    <stop offset="1.00" stop-color="#ffcf7a"/>
    <animate attributeName="x1" values="-1;0;1" dur="19s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;1;2" dur="19s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="hrIrisSoft" x1="0" y1="0" x2="1" y2="0.6">
    <stop offset="0.00" stop-color="#69f0d0" stop-opacity="0.4"/>
    <stop offset="0.34" stop-color="#eaf6ff" stop-opacity="0.3"/>
    <stop offset="0.62" stop-color="#b79cff" stop-opacity="0.36"/>
    <stop offset="1.00" stop-color="#7fe4fa" stop-opacity="0.32"/>
    <animate attributeName="x1" values="-0.8;0.2;1.2" dur="26s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0.2;1.2;2.2" dur="26s" repeatCount="indefinite"/>
  </linearGradient>

  <!-- the polished top arris, and the ground bottom one -->
  <linearGradient id="hrArris" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="8%"   stop-color="#ffffff" stop-opacity="0.7"/>
    <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="hrSheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.42"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>

  <!-- a corner glint: light funnelled into the 90-degree arris -->
  <radialGradient id="hrGlint" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.85"/>
    <stop offset="38%"  stop-color="#eaf6ff" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#eaf6ff" stop-opacity="0"/>
  </radialGradient>

  <filter id="hrCast" x="-14%" y="-14%" width="128%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="6"
                  flood-color="#00070f"
                  flood-opacity="0.7"/>
  </filter>
  <filter id="hrCaustic" x="-40%" y="-60%" width="180%" height="260%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <clipPath id="hrShape"><path d="M7.00 7.00H437.00V171.00H7.00Z"/></clipPath>
  <clipPath id="hrInner"><path d="M7.00 28.00H437.00V171.00H7.00Z"/></clipPath>
</defs>


  <path d="M7.00 7.00H437.00V171.00H7.00Z" fill="#05141e" opacity="0.55" filter="url(#hrCast)"/>
  <rect x="75.8" y="173.0" width="292.4" height="7"
        fill="url(#hrIrisSoft)" opacity="0.3" filter="url(#hrCaustic)"/>

  <path d="M7.00 7.00H437.00V171.00H7.00Z" fill="url(#hrFace)"/>
  <path d="M7.00 7.00H437.00V171.00H7.00Z" fill="url(#hrEdgeV)"/>

  <!-- edge band: dispersion strongest where the sheet is seen at a grazing angle -->
  <g clip-path="url(#hrShape)">
    <rect x="7" y="7" width="430" height="164" fill="none"
          stroke="url(#hrIrisSoft)" stroke-width="18"
          opacity="0.17"/>
    <rect x="-208.0" y="7" width="215.0" height="164"
          fill="url(#hrSheen)" opacity="0.1" transform="skewX(-12)">
      <animate attributeName="x" values="-229.5;480.0" dur="17s" repeatCount="indefinite"/>
    </rect>
    <ellipse cx="7" cy="7" rx="10" ry="10" fill="url(#hrGlint)" opacity="0.7"/><ellipse cx="437" cy="7" rx="10" ry="10" fill="url(#hrGlint)" opacity="0.4"/><ellipse cx="7" cy="171" rx="10" ry="10" fill="url(#hrGlint)" opacity="0.28"/><ellipse cx="437" cy="171" rx="10" ry="10" fill="url(#hrGlint)" opacity="0.45"/>
  </g>

  <!-- polished arris along the top, ground edge along the bottom -->
  <path d="M7.5 7.5H436.5" stroke="url(#hrArris)" stroke-width="1"/>
  <path d="M7.5 170.5H436.5" stroke="#05141e" stroke-width="1"
        opacity="0.75"/>
  <path d="M7.00 7.00H437.00V171.00H7.00Z" fill="none" stroke="url(#hrIris)" stroke-width="0.9"
        opacity="0.5"/>
  <path d="M17 28 H427"
        stroke="url(#hrIrisSoft)" stroke-width="0.6" opacity="0.75"/>
  <g class="t">
    <circle cx="22" cy="19" r="2.6" fill="none" stroke="#6fe0f7" stroke-width="0.45"/>
    <circle cx="22" cy="19" r="0.9" fill="#6fe0f7"/>
    <text x="31" y="22" fill="#6fe0f7" font-size="7.4" letter-spacing="2.8">COMMIT HOURS</text>
    <text x="423" y="22" fill="#63a8c0" font-size="6.8" letter-spacing="1.8"
          text-anchor="end">JST &#183; PEAK 12:00</text>
  </g>
<g clip-path="url(#hrInner)">

  <defs>
    <linearGradient id="hrShimmer" gradientUnits="userSpaceOnUse"
                    x1="33" y1="0" x2="163" y2="0">
      <stop offset="0%" stop-color="#6fe0f7" stop-opacity="0.35"/>
      <stop offset="42%" stop-color="#eafcff" stop-opacity="0.95"/>
      <stop offset="58%" stop-color="#eafcff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#6fe0f7" stop-opacity="0.35"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-120;444" dur="6.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <g class="t">
    <rect x="36.9" y="91.1" width="8.4" height="4.7" rx="1" fill="#6fe0f7" opacity="0.12"/><rect x="52.9" y="74.7" width="8.4" height="37.6" rx="1" fill="#6fe0f7" opacity="0.12"/><rect x="69.0" y="67.6" width="8.4" height="51.8" rx="1" fill="#6fe0f7" opacity="0.12"/><rect x="85.1" y="88.8" width="8.4" height="9.4" rx="1" fill="#6fe0f7" opacity="0.12"/><rect x="101.2" y="91.1" width="8.4" height="4.7" rx="1" fill="#6fe0f7" opacity="0.12"/><rect x="117.3" y="86.4" width="8.4" height="14.1" rx="1" fill="#6fe0f7" opacity="0.12"/><rect x="133.4" y="93.5" width="8.4" height="0.0" rx="1" fill="#6fe0f7" opacity="0.05"/><rect x="149.4" y="93.5" width="8.4" height="0.0" rx="1" fill="#6fe0f7" opacity="0.05"/><rect x="165.5" y="88.8" width="8.4" height="9.4" rx="1" fill="#6fe0f7" opacity="0.12"/><rect x="181.6" y="93.5" width="8.4" height="0.0" rx="1" fill="#6fe0f7" opacity="0.05"/><rect x="197.7" y="93.5" width="8.4" height="0.0" rx="1" fill="#6fe0f7" opacity="0.05"/><rect x="213.8" y="86.4" width="8.4" height="14.1" rx="1" fill="#6fe0f7" opacity="0.12"/><rect x="229.9" y="53.5" width="8.4" height="80.0" rx="1" fill="#6fe0f7" opacity="0.12"/><rect x="245.9" y="74.7" width="8.4" height="37.6" rx="1" fill="#6fe0f7" opacity="0.12"/><rect x="262.0" y="79.4" width="8.4" height="28.2" rx="1" fill="#6fe0f7" opacity="0.12"/><rect x="278.1" y="86.4" width="8.4" height="14.1" rx="1" fill="#6fe0f7" opacity="0.12"/><rect x="294.2" y="60.6" width="8.4" height="65.9" rx="1" fill="#6fe0f7" opacity="0.12"/><rect x="310.3" y="67.6" width="8.4" height="51.8" rx="1" fill="#6fe0f7" opacity="0.12"/><rect x="326.4" y="72.3" width="8.4" height="42.4" rx="1" fill="#6fe0f7" opacity="0.12"/><rect x="342.4" y="81.7" width="8.4" height="23.5" rx="1" fill="#6fe0f7" opacity="0.12"/><rect x="358.5" y="55.9" width="8.4" height="75.3" rx="1" fill="#6fe0f7" opacity="0.12"/><rect x="374.6" y="74.7" width="8.4" height="37.6" rx="1" fill="#6fe0f7" opacity="0.12"/><rect x="390.7" y="81.7" width="8.4" height="23.5" rx="1" fill="#6fe0f7" opacity="0.12"/><rect x="406.8" y="70.0" width="8.4" height="47.1" rx="1" fill="#6fe0f7" opacity="0.12"/>
    <line x1="33" y1="93.5" x2="419" y2="93.5" stroke="#63a8c0" stroke-width="0.45" opacity="0.6"/>
    <path d="M33 93.5 L41.0 91.1 L57.1 74.7 L73.2 67.6 L89.3 88.8 L105.4 91.1 L121.5 86.4 L137.5 93.5 L153.6 93.5 L169.7 88.8 L185.8 93.5 L201.9 93.5 L218.0 86.4 L234.0 53.5 L250.1 74.7 L266.2 79.4 L282.3 86.4 L298.4 60.6 L314.5 67.6 L330.5 72.3 L346.6 81.7 L362.7 55.9 L378.8 74.7 L394.9 81.7 L411.0 70.0 L419 93.5 L411.0 117.0 L394.9 105.3 L378.8 112.3 L362.7 131.1 L346.6 105.3 L330.5 114.7 L314.5 119.4 L298.4 126.4 L282.3 100.6 L266.2 107.6 L250.1 112.3 L234.0 133.5 L218.0 100.6 L201.9 93.5 L185.8 93.5 L169.7 98.2 L153.6 93.5 L137.5 93.5 L121.5 100.6 L105.4 95.9 L89.3 98.2 L73.2 119.4 L57.1 112.3 L41.0 95.9 Z" fill="url(#hrShimmer)" stroke="#6fe0f7" stroke-width="0.45" opacity="0.95"/>
    <line x1="234.0" y1="45.5" x2="234.0" y2="137.5"
          stroke="#f0c069" stroke-width="0.45" opacity="0.85"/>
    <text x="234.0" y="42.5" fill="#f0c069" font-size="5.8"
          text-anchor="middle" letter-spacing="0.8">PEAK</text>
    <line x1="41.0" y1="139.5" x2="41.0" y2="143.5" stroke="#63a8c0" stroke-width="0.45" opacity="0.7"/><text x="41.0" y="152.5" fill="#63a8c0" font-size="5.8" text-anchor="middle">00</text><line x1="137.5" y1="139.5" x2="137.5" y2="143.5" stroke="#63a8c0" stroke-width="0.45" opacity="0.7"/><text x="137.5" y="152.5" fill="#63a8c0" font-size="5.8" text-anchor="middle">06</text><line x1="234.0" y1="139.5" x2="234.0" y2="143.5" stroke="#63a8c0" stroke-width="0.45" opacity="0.7"/><text x="234.0" y="152.5" fill="#63a8c0" font-size="5.8" text-anchor="middle">12</text><line x1="330.5" y1="139.5" x2="330.5" y2="143.5" stroke="#63a8c0" stroke-width="0.45" opacity="0.7"/><text x="330.5" y="152.5" fill="#63a8c0" font-size="5.8" text-anchor="middle">18</text><line x1="411.0" y1="139.5" x2="411.0" y2="143.5" stroke="#63a8c0" stroke-width="0.45" opacity="0.7"/><text x="411.0" y="152.5" fill="#63a8c0" font-size="5.8" text-anchor="middle">23</text>
    <text x="25" y="162" fill="#63a8c0" font-size="5.8" letter-spacing="1.6">143 COMMITS BY HOUR OF DAY</text>
  </g>
  <rect x="7" y="28" width="430" height="143" fill="url(#hrScan)" opacity="0.2"/>
  <rect x="7" y="28" width="430" height="143" filter="url(#hrGrain)" opacity="0.16"/>
</g>
</svg>
