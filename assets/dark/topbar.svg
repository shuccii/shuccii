<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 44" width="900" height="44" role="img" aria-label="status bar">
<defs>
  <radialGradient id="tbDeep" cx="16%" cy="50%" r="88%">
    <stop offset="0%" stop-color="#123a4e" stop-opacity="0.5"/>
    <stop offset="46%" stop-color="#0b2534" stop-opacity="0.40"/>
    <stop offset="100%" stop-color="#05141e" stop-opacity="0.3"/>
  </radialGradient>
  <radialGradient id="tbVig" cx="50%" cy="50%" r="74%">
    <stop offset="58%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
  </radialGradient>
  <radialGradient id="tbCore" cx="50%" cy="42%" r="58%"><stop offset="0%" stop-color="#ffffff" stop-opacity="1"/><stop offset="26%" stop-color="#dff8ff" stop-opacity="1"/><stop offset="60%" stop-color="#54c8e8" stop-opacity="0.62"/><stop offset="100%" stop-color="#0a4b61" stop-opacity="0"/></radialGradient>
  <linearGradient id="tbSweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#6fe0f7" stop-opacity="0"/>
    <stop offset="52%" stop-color="#6fe0f7" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#6fe0f7" stop-opacity="0"/>
  </linearGradient>
  <filter id="tbBevel" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="hh"/>
    <feSpecularLighting in="hh" surfaceScale="3.6" specularConstant="0.85"
                        specularExponent="26" lighting-color="#dff6ff" result="s">
      <fePointLight x="-70" y="-70" z="60">
        <animate attributeName="x" values="-70;70;-70" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-70;70;-70" dur="13s" repeatCount="indefinite"/>
      </fePointLight>
    </feSpecularLighting>
    <feComposite in="s" in2="SourceAlpha" operator="in" result="sc"/>
    <feComposite in="SourceGraphic" in2="sc" operator="arithmetic" k1="0" k2="1" k3="0.90" k4="0"/>
  </filter>
  <filter id="tbGlow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="0.90" result="a"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="3.60" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="tbGrain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="5" result="n">
      <animate attributeName="seed" values="5;13;21;5" dur="1.3s" calcMode="discrete" repeatCount="indefinite"/>
    </feTurbulence>
    <feColorMatrix in="n" type="matrix"
      values="0 0 0 0 0.12  0 0 0 0 0.66  0 0 0 0 0.8  0 0 0 0.18 0"/>
  </filter>
  <pattern id="tbScan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="0.8" fill="#0a3242" opacity="0.28"/>
  </pattern>
  <clipPath id="tbClip"><rect width="900" height="44" rx="3"/></clipPath>
  <style>.t{font-family:"SFMono-Regular","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;}</style>
  <!-- Fresnel: transparent looking straight through, reflective at the edges -->
  <linearGradient id="tbFace" x1="0.12" y1="0" x2="0.55" y2="1">
    <stop offset="0%"   stop-color="#123a4e" stop-opacity="0.5"/>
    <stop offset="46%"  stop-color="#0b2534"   stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#05141e" stop-opacity="0.40"/>
  </linearGradient>
  <linearGradient id="tbEdgeV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#123a4e" stop-opacity="0.5"/>
    <stop offset="14%"  stop-color="#0b2534"   stop-opacity="0"/>
    <stop offset="86%"  stop-color="#05141e" stop-opacity="0"/>
    <stop offset="100%" stop-color="#05141e" stop-opacity="0.62"/>
  </linearGradient>

  <!-- dispersion: the hues travel along the edge, so the colour itself flows -->
  <linearGradient id="tbIris" x1="0" y1="0" x2="1" y2="0.35"
                  gradientUnits="objectBoundingBox">
    <stop offset="0.00" stop-color="#7fe4fa"/>
    <stop offset="0.26" stop-color="#69f0d0"/>
    <stop offset="0.48" stop-color="#eaf6ff"/>
    <stop offset="0.71" stop-color="#b79cff"/>
    <stop offset="1.00" stop-color="#ffcf7a"/>
    <animate attributeName="x1" values="-1;0;1" dur="19s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;1;2" dur="19s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="tbIrisSoft" x1="0" y1="0" x2="1" y2="0.6">
    <stop offset="0.00" stop-color="#69f0d0" stop-opacity="0.4"/>
    <stop offset="0.34" stop-color="#eaf6ff" stop-opacity="0.3"/>
    <stop offset="0.62" stop-color="#b79cff" stop-opacity="0.36"/>
    <stop offset="1.00" stop-color="#7fe4fa" stop-opacity="0.32"/>
    <animate attributeName="x1" values="-0.8;0.2;1.2" dur="26s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0.2;1.2;2.2" dur="26s" repeatCount="indefinite"/>
  </linearGradient>

  <!-- the polished top arris, and the ground bottom one -->
  <linearGradient id="tbArris" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="8%"   stop-color="#ffffff" stop-opacity="0.7"/>
    <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="tbSheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.42"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>

  <!-- a corner glint: light funnelled into the 90-degree arris -->
  <radialGradient id="tbGlint" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.85"/>
    <stop offset="38%"  stop-color="#eaf6ff" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#eaf6ff" stop-opacity="0"/>
  </radialGradient>

  <filter id="tbCast" x="-14%" y="-14%" width="128%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="6"
                  flood-color="#00070f"
                  flood-opacity="0.7"/>
  </filter>
  <filter id="tbCaustic" x="-40%" y="-60%" width="180%" height="260%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <clipPath id="tbShape"><path d="M10.00 7.00H890.00A3.00 3.00 0 0 1 893.00 10.00V34.00A3.00 3.00 0 0 1 890.00 37.00H10.00A3.00 3.00 0 0 1 7.00 34.00V10.00A3.00 3.00 0 0 1 10.00 7.00Z"/></clipPath>
  <clipPath id="tbTick"><rect x="246" y="8" width="544" height="28"/></clipPath>
  <linearGradient id="tbFade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0b2534"/><stop offset="6%" stop-color="#0b2534" stop-opacity="0"/>
    <stop offset="94%" stop-color="#0b2534" stop-opacity="0"/><stop offset="100%" stop-color="#0b2534"/>
  </linearGradient>
</defs>

  <path d="M10.00 7.00H890.00A3.00 3.00 0 0 1 893.00 10.00V34.00A3.00 3.00 0 0 1 890.00 37.00H10.00A3.00 3.00 0 0 1 7.00 34.00V10.00A3.00 3.00 0 0 1 10.00 7.00Z" fill="#05141e" opacity="0.55" filter="url(#tbCast)"/>
  <rect x="148.8" y="39.0" width="602.5" height="7"
        fill="url(#tbIrisSoft)" opacity="0.3" filter="url(#tbCaustic)"/>

  <path d="M10.00 7.00H890.00A3.00 3.00 0 0 1 893.00 10.00V34.00A3.00 3.00 0 0 1 890.00 37.00H10.00A3.00 3.00 0 0 1 7.00 34.00V10.00A3.00 3.00 0 0 1 10.00 7.00Z" fill="url(#tbFace)"/>
  <path d="M10.00 7.00H890.00A3.00 3.00 0 0 1 893.00 10.00V34.00A3.00 3.00 0 0 1 890.00 37.00H10.00A3.00 3.00 0 0 1 7.00 34.00V10.00A3.00 3.00 0 0 1 10.00 7.00Z" fill="url(#tbEdgeV)"/>

  <!-- edge band: dispersion strongest where the sheet is seen at a grazing angle -->
  <g clip-path="url(#tbShape)">
    <path d="M10.00 7.00H890.00A3.00 3.00 0 0 1 893.00 10.00V34.00A3.00 3.00 0 0 1 890.00 37.00H10.00A3.00 3.00 0 0 1 7.00 34.00V10.00A3.00 3.00 0 0 1 10.00 7.00Z" fill="none"
          stroke="url(#tbIrisSoft)" stroke-width="18"
          opacity="0.17"/>
    <rect x="-436.0" y="7" width="443.0" height="30"
          fill="url(#tbSheen)" opacity="0.1" transform="skewX(-12)">
      <animate attributeName="x" values="-480.3;981.6" dur="17s" repeatCount="indefinite"/>
    </rect>
    <ellipse cx="10.0" cy="10.0" rx="10" ry="10" fill="url(#tbGlint)" opacity="0.7"/><ellipse cx="890.0" cy="10.0" rx="10" ry="10" fill="url(#tbGlint)" opacity="0.4"/><ellipse cx="10.0" cy="34.0" rx="10" ry="10" fill="url(#tbGlint)" opacity="0.28"/><ellipse cx="890.0" cy="34.0" rx="10" ry="10" fill="url(#tbGlint)" opacity="0.45"/>
  </g>

  <!-- polished arris along the top, ground edge along the bottom -->
  <path d="M10.0 7.5H890.0" stroke="url(#tbArris)" stroke-width="1"/>
  <path d="M10.0 36.5H890.0" stroke="#05141e" stroke-width="1"
        opacity="0.75"/>
  <path d="M10.00 7.00H890.00A3.00 3.00 0 0 1 893.00 10.00V34.00A3.00 3.00 0 0 1 890.00 37.00H10.00A3.00 3.00 0 0 1 7.00 34.00V10.00A3.00 3.00 0 0 1 10.00 7.00Z" fill="none" stroke="url(#tbIris)" stroke-width="0.9"
        opacity="0.5"/>
  <g class="t">
    <text x="22" y="25.6" fill="#f7feff" font-size="9.5" letter-spacing="4.6">S / T A N I</text>
    <circle cx="176" cy="22" r="2.8" fill="#6fe0f7" filter="url(#tbGlow)">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="185" y="24.6" fill="#6fe0f7" font-size="7.2" letter-spacing="2.4">LIVE</text>
    <line x1="234" y1="12" x2="234" y2="32" stroke="#63a8c0" stroke-width="0.45" opacity="0.6"/>
    <g clip-path="url(#tbTick)">
      <text y="24.6" fill="#63a8c0" font-size="6.8" letter-spacing="2.4" xml:space="preserve">
        <animate attributeName="x" values="246;-899" dur="42s" repeatCount="indefinite"/>
        REPO shuccii/shuccii   •   BRANCH main   •   HEAD 8f555c7   •   CONTRIB 161   •   COMMITS 158   •   PEAK 79/WK   •   LANG PYTHON   •   SYNC 2026-09-10 21:00Z   •   REPO shuccii/shuccii   •   BRANCH main   •   HEAD 8f555c7   •   CONTRIB 161   •   COMMITS 158   •   PEAK 79/WK   •   LANG PYTHON   •   SYNC 2026-09-10 21:00Z   •   
      </text>
    </g>
    <rect x="246" y="8" width="544" height="28" fill="url(#tbFade)"/>
    <line x1="796" y1="12" x2="796" y2="32" stroke="#63a8c0" stroke-width="0.45" opacity="0.6"/>
    <text x="876" y="25" fill="#dcf3fd" font-size="8.1" letter-spacing="1.8" text-anchor="end">2023 &#8594; NOW</text>
  </g>
</svg>
